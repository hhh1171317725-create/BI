server {
    listen 80;
    server_name huanghaha.fun www.huanghaha.fun;
    root /www/wwwroot/BI/frontend;
    index index.html;
    client_max_body_size 55m;

    # Spring Boot 只接收 API 请求，响应内容统一为 JSON。
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 保持原有的无扩展名页面地址。
    location = /login {
        try_files /login.html =404;
    }

    location = /jd {
        try_files /jd.html =404;
    }

    location = /tools {
        try_files /tools.html =404;
    }

    location = /chat {
        try_files /chat.html =404;
    }

    location = /deeplink {
        try_files /deeplink.html =404;
    }

    location = /account {
        try_files /account.html =404;
    }

    location ~* \.(?:js|css|png)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
