server {
    listen 80;
    server_name huanghaha.fun www.huanghaha.fun;
    root /www/wwwroot/BI/frontend;
    index index.html;
    client_max_body_size 55m;
    sendfile on;
    tcp_nopush on;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;

    # Spring Boot 只接收 API 请求，响应内容统一为 JSON。
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 保持原有的无扩展名页面地址。
    location = /login {
        try_files /login.html =404;
    }

    location = /jd {
        try_files /jd.html =404;
    }

    location = /jd-low-activity {
        try_files /jd-low-activity.html =404;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /tools {
        try_files /tools.html =404;
    }

    location = /chat {
        try_files /chat.html =404;
    }

    location = /todo {
        try_files /todo.html =404;
    }

    location = /deeplink {
        try_files /deeplink.html =404;
    }

    location = /deeplink-account {
        try_files /deeplink-account.html =404;
    }

    location = /jd-images {
        try_files /jd-images.html =404;
    }

    location = /mail-dingtalk {
        try_files /mail-dingtalk.html =404;
    }

    location = /account {
        try_files /account.html =404;
    }

    location = /account-vault {
        try_files /account-vault.html =404;
    }

    # The legacy browser terminal is intentionally disabled on the public site.
    # Application-level admin checks remain in place as a second boundary.
    location = /terminal { return 404; }
    location = /terminal.html { return 404; }
    location = /ws/terminal { return 404; }

    location ~* \.(?:js|css|png)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
