<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{if(s.user?.role!=='admin'){location.replace('/tools');return}document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <title>账户对应关系</title>
  <script src="/report-visibility.js"></script>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--bad:#b42318;--good:#067647}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}button,input,textarea{font:inherit}header{padding:18px 28px 14px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:6px;background:#1f2937;color:#fff;font-weight:700}h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:6px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.secondary{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font-weight:600;line-height:32px;cursor:pointer}.nav button,.secondary{line-height:normal}main{padding:18px 28px 36px}.toolbar{display:flex;align-items:flex-end;gap:10px;padding:14px;border:1px solid var(--line);background:#fff}.field{display:grid;gap:6px}.field span{font-size:12px;font-weight:600;color:#475467}.search{min-width:280px;flex:1}.field input,.field textarea{width:100%;min-width:0;border:1px solid #b9c9d9;border-radius:5px;background:#fff;color:var(--ink)}.field input{height:38px;padding:0 10px}.field textarea{min-height:120px;padding:10px;resize:vertical;line-height:1.55}.primary{height:38px;padding:0 14px;border:0;border-radius:5px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}.primary:hover{background:#0958d9}button:disabled{opacity:.6;cursor:wait}.status{min-height:20px;margin:10px 0;color:var(--muted)}.status.ok{color:var(--good)}.status.error{color:var(--bad)}.table-shell{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;min-width:920px;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:top}th{background:#f8fafc;color:#475467;font-size:12px;white-space:nowrap}td{line-height:1.5;word-break:break-word}.keyword{font-weight:700}.accounts{display:grid;justify-items:start;gap:2px;font-family:ui-monospace,Consolas,monospace}.account-link{color:#1756a9;text-decoration:none}.account-link:hover{text-decoration:underline}.count{display:inline-flex;margin-top:4px;padding:1px 6px;border-radius:4px;background:#edf5ff;color:#1756a9;font-size:12px}.meta{color:var(--muted);font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{height:28px;padding:0 8px;border:1px solid #c7d3df;border-radius:4px;background:#fff;color:#1756a9;font-size:12px;cursor:pointer}.mini.delete{color:var(--bad)}.link{color:#1756a9}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px}.pagination span{color:var(--muted)}dialog{width:min(700px,calc(100vw - 28px));max-height:calc(100vh - 28px);padding:0;border:1px solid var(--line);border-radius:7px;box-shadow:0 24px 70px rgba(23,43,77,.28)}dialog::backdrop{background:rgba(23,43,77,.42)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:18px}.close{width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.dialog-body{padding:16px 18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.span-2{grid-column:span 2}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}.import-note{margin:0 0 12px;color:var(--muted);line-height:1.7}
    @media(max-width:760px){body{overflow-x:hidden}header{padding:15px}.header-row{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.nav a,.nav button{display:flex;align-items:center;justify-content:center}main{padding:12px}.toolbar{align-items:stretch;flex-direction:column}.search{min-width:0}.toolbar button{width:100%}.table-shell{overflow:visible;border:0;background:transparent}table,tbody{display:block;min-width:0}thead{display:none}tr{display:block;margin-bottom:10px;padding:12px;border:1px solid var(--line);background:#fff}td{display:grid;grid-template-columns:82px minmax(0,1fr);padding:7px 0;border:0}td::before{content:attr(data-label);color:var(--muted);font-size:12px}.pagination{justify-content:space-between}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.dialog-body{padding:14px}.dialog-actions{padding:12px 14px}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">账</span><h1>账户对应关系</h1></div><p>一个关键词对应多个账户，并绑定投放国家、channel、style ID 和文章链接。</p></div><nav class="nav"><a href="/tools">工具中心</a><a href="/account">设置</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main>
    <section class="toolbar">
      <label class="field search"><span>搜索</span><input id="query" type="search" placeholder="搜索关键词、账户、国家、channel 或 style ID" /></label>
      <button class="secondary" id="importButton" type="button">导入 Excel</button><input id="importFile" type="file" accept=".xlsx" hidden />
      <button class="secondary" id="exportButton" type="button">导出 Excel</button>
      <button class="primary" id="addButton" type="button">新增对应关系</button>
    </section>
    <div id="status" class="status"></div>
    <section class="table-shell"><table><thead><tr><th>关键词</th><th>账户</th><th>投放国家</th><th>channel</th><th>style ID</th><th>文章链接</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>还没有关键词账户对应关系</div></section>
    <div class="pagination"><button class="secondary" id="prev" type="button">上一页</button><span id="pageInfo">第 1 页</span><button class="secondary" id="next" type="button">下一页</button></div>
  </main>
  <dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle">新增对应关系</h2><button class="close" id="closeEditor" type="button" aria-label="关闭">×</button></div><div class="dialog-body"><div class="form-grid">
    <label class="field span-2"><span>关键词</span><input id="editKeyword" required maxlength="1000" placeholder="输入一个关键词" /></label>
    <label class="field span-2"><span>账户 ID（每行一个）</span><textarea id="editAccounts" required maxlength="20000" placeholder="1869943308174339&#10;1869943308174340"></textarea></label>
    <label class="field span-2"><span>投放国家</span><input id="editCountry" required maxlength="255" placeholder="例如：美国" /></label>
    <label class="field"><span>channel</span><input id="editChannel" required maxlength="255" /></label>
    <label class="field"><span>style ID</span><input id="editStyle" required maxlength="255" /></label>
    <label class="field span-2"><span>文章链接</span><input id="editArticleUrl" type="text" inputmode="url" required maxlength="2000" placeholder="支持 {campaign_id}、{cf_click_id} 等宏参数" /></label>
  </div></div><div class="dialog-actions"><button class="secondary" id="cancelEditor" type="button">取消</button><button class="primary" id="saveButton" type="submit">保存</button></div></form></dialog>
  <dialog id="importDialog"><div class="dialog-head"><h2>导入 Excel</h2><button class="close" id="closeImport" type="button" aria-label="关闭">×</button></div><div class="dialog-body"><p class="import-note">Excel 需要六列：关键词、账户ID、投放国家、channel、style ID、文章链接。一个关键词的多个账户请在同一个单元格内换行填写。也兼容原表中的“账户”“国家”和“url”列名。</p><div id="importFilename" class="meta"></div></div><div class="dialog-actions"><button class="secondary" id="cancelImport" type="button">取消</button><button class="primary" id="confirmImport" type="button">开始导入</button></div></dialog>
  <script>
    const $=s=>document.querySelector(s),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let entries=[],page=1,pages=1,editingId=0,searchTimer,selectedFile;
    async function api(url,options={}){const r=await fetch(url,options);const p=await r.json().catch(()=>({error:`请求失败（HTTP ${r.status}）`}));if(r.status===401){location.replace('/login');throw Error('登录已失效')}if(r.status===403){location.replace('/tools');throw Error('仅管理员可使用')}if(!r.ok)throw Error(p.error||`请求失败（HTTP ${r.status}）`);return p}
    function status(message,type=''){$('#status').textContent=message;$('#status').className=`status ${type}`}
    function display(value){return value?esc(value):'<span class="meta">未填写</span>'}
    function localDate(){const now=new Date(),part=n=>String(n).padStart(2,'0');return`${now.getFullYear()}-${part(now.getMonth()+1)}-${part(now.getDate())}`}
    function accountLinks(value){const date=localDate();return String(value||'').split(/\r?\n/).map(id=>id.trim()).filter(Boolean).map(id=>`<a class="account-link" href="https://ads.tiktok.com/i18n/manage/campaign?aadvid=${encodeURIComponent(id)}&amp;navigate_from=dashboard&amp;relative_time=today&amp;st=${date}&amp;et=${date}" target="_blank" rel="noopener">${esc(id)}</a>`).join('')}
    function render(){const body=$('#rows');body.innerHTML=entries.map(e=>`<tr><td data-label="关键词"><div class="keyword">${esc(e.keyword)}</div><div class="meta">更新：${esc((e.updatedAt||'').replace('T',' '))}</div></td><td data-label="账户"><div class="accounts">${accountLinks(e.accountIds)}</div><span class="count">${e.accountCount||0} 个账户</span></td><td data-label="投放国家">${display(e.country)}</td><td data-label="channel">${display(e.channelId)}</td><td data-label="style ID">${display(e.styleId)}</td><td data-label="文章链接">${e.articleUrl?`<a class="link" href="${esc(e.articleUrl)}" target="_blank" rel="noopener">打开文章</a>`:'<span class="meta">未填写</span>'}</td><td data-label="操作"><div class="actions"><button class="mini" type="button" data-edit="${e.id}">编辑</button><button class="mini delete" type="button" data-delete="${e.id}">删除</button></div></td></tr>`).join('');$('#empty').hidden=entries.length>0;$('#pageInfo').textContent=`第 ${page} / ${pages} 页`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages}
    async function load(){try{status('正在加载...');const params=new URLSearchParams({query:$('#query').value.trim(),page,pageSize:20});const data=await api(`/api/account-vault?${params}`);entries=data.entries||[];pages=data.pages||1;page=data.page||1;render();status(`共 ${data.total||0} 条对应关系`)}catch(e){status(e.message,'error')}}
    function payload(){return{keyword:$('#editKeyword').value.trim(),accountIds:$('#editAccounts').value,country:$('#editCountry').value.trim(),channelId:$('#editChannel').value.trim(),styleId:$('#editStyle').value.trim(),articleUrl:$('#editArticleUrl').value.trim()}}
    function openEditor(entry){editingId=entry?.id||0;$('#editorTitle').textContent=editingId?'编辑对应关系':'新增对应关系';$('#editKeyword').value=entry?.keyword||'';$('#editAccounts').value=entry?.accountIds||'';$('#editCountry').value=entry?.country||'';$('#editChannel').value=entry?.channelId||'';$('#editStyle').value=entry?.styleId||'';$('#editArticleUrl').value=entry?.articleUrl||'';$('#editor').showModal();setTimeout(()=>$('#editKeyword').focus(),0)}
    $('#query').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;load()},250)};$('#prev').onclick=()=>{if(page>1){page--;load()}};$('#next').onclick=()=>{if(page<pages){page++;load()}};
    $('#addButton').onclick=()=>openEditor();$('#closeEditor').onclick=$('#cancelEditor').onclick=()=>$('#editor').close();
    $('#editorForm').onsubmit=async event=>{event.preventDefault();const button=$('#saveButton');try{button.disabled=true;await api(editingId?`/api/account-vault/${editingId}`:'/api/account-vault',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});$('#editor').close();status('对应关系已保存','ok');await load()}catch(e){status(e.message,'error')}finally{button.disabled=false}};
    $('#rows').onclick=async event=>{const id=Number(event.target.dataset.edit||event.target.dataset.delete);if(!id)return;const entry=entries.find(item=>item.id===id);if(event.target.dataset.edit){openEditor(entry);return}if(!confirm(`确定删除关键词“${entry.keyword}”的对应关系吗？`))return;try{await api(`/api/account-vault/${id}`,{method:'DELETE'});status('对应关系已删除','ok');await load()}catch(e){status(e.message,'error')}};
    $('#importButton').onclick=()=>$('#importFile').click();$('#importFile').onchange=()=>{selectedFile=$('#importFile').files[0];if(!selectedFile)return;$('#importFilename').textContent=selectedFile.name;$('#importDialog').showModal()};$('#closeImport').onclick=$('#cancelImport').onclick=()=>$('#importDialog').close();$('#confirmImport').onclick=async()=>{const button=$('#confirmImport');try{button.disabled=true;const form=new FormData();form.append('file',selectedFile);const result=await api('/api/account-vault/import',{method:'POST',body:form});$('#importDialog').close();$('#importFile').value='';status(`成功导入 ${result.imported} 条对应关系`,'ok');page=1;await load()}catch(e){status(e.message,'error')}finally{button.disabled=false}};
    $('#exportButton').onclick=()=>{location.href='/api/account-vault/export'};$('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};load();
  </script>
</body>
</html>
