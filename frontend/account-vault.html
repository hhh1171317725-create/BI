<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{if(s.user?.role!=='admin'){location.replace('/tools');return}document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <title>账户资料管理</title>
  <script src="/report-visibility.js"></script>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--bad:#b42318;--good:#067647;--soft:#edf5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}button,input,select,textarea{font:inherit}header{padding:18px 28px 14px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:6px;background:#1f2937;color:#fff;font-weight:700}h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:6px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.secondary{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font-weight:600;line-height:32px;cursor:pointer}.nav button,.secondary{line-height:normal}.nav a:hover,.nav button:hover,.secondary:hover{border-color:var(--blue);background:#eaf3ff}main{padding:18px 28px 36px}.toolbar{display:flex;align-items:flex-end;gap:10px;padding:14px;border:1px solid var(--line);background:#fff}.field{display:grid;gap:6px}.field span{font-size:12px;font-weight:600;color:#475467}.search{min-width:280px;flex:1}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #b9c9d9;border-radius:5px;background:#fff;color:var(--ink)}.field input,.field select{height:38px;padding:0 10px}.field textarea{min-height:80px;padding:9px;resize:vertical}.primary,.danger{height:38px;padding:0 14px;border:0;border-radius:5px;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}.primary{background:var(--blue)}.primary:hover{background:#0958d9}.danger{background:var(--bad)}button:disabled{opacity:.6;cursor:wait}.status{min-height:20px;margin:10px 0;color:var(--muted)}.status.ok{color:var(--good)}.status.error{color:var(--bad)}.table-shell{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;min-width:1180px;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:top}th{position:sticky;top:0;z-index:1;background:#f8fafc;color:#475467;font-size:12px;white-space:nowrap}td{max-width:260px;line-height:1.45;word-break:break-word}.name{font-weight:700}.meta{color:var(--muted);font-size:12px}.category{display:inline-flex;padding:2px 7px;border-radius:4px;background:var(--soft);color:#1756a9;font-size:12px}.secret{font-family:ui-monospace,Consolas,monospace}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{height:28px;padding:0 8px;border:1px solid #c7d3df;border-radius:4px;background:#fff;color:#1756a9;font-size:12px;cursor:pointer}.mini.delete{color:var(--bad)}.link{color:#1756a9}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px}.pagination span{color:var(--muted)}dialog{width:min(820px,calc(100vw - 28px));max-height:calc(100vh - 28px);padding:0;border:1px solid var(--line);border-radius:7px;box-shadow:0 24px 70px rgba(23,43,77,.28)}dialog::backdrop{background:rgba(23,43,77,.42)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:18px}.close{width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.dialog-body{padding:16px 18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.span-2{grid-column:span 2}.secret-row{display:grid;grid-template-columns:1fr auto;gap:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}.import-note{margin:0 0 12px;color:var(--muted);line-height:1.6}
    @media(max-width:760px){body{overflow-x:hidden}header{padding:15px}.header-row{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.nav a,.nav button{display:flex;align-items:center;justify-content:center}main{padding:12px}.toolbar{align-items:stretch;flex-direction:column}.search{min-width:0}.toolbar button{width:100%}.table-shell{overflow:visible;border:0;background:transparent}table,tbody{display:block;min-width:0}thead{display:none}tr{display:block;margin-bottom:10px;padding:12px;border:1px solid var(--line);background:#fff}td{display:grid;grid-template-columns:82px minmax(0,1fr);max-width:none;padding:7px 0;border:0}td::before{content:attr(data-label);color:var(--muted);font-size:12px}.actions{margin-top:4px}.pagination{justify-content:space-between}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.secret-row{grid-template-columns:1fr}.secret-row button{height:34px}.dialog-body{padding:14px}.dialog-actions{padding:12px 14px}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">账</span><h1>账户资料管理</h1></div><p>统一管理投放账户、平台登录与链接资源。</p></div><nav class="nav"><a href="/tools">工具中心</a><a href="/account">设置</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main>
    <section class="toolbar">
      <label class="field search"><span>搜索</span><input id="query" type="search" placeholder="名称、账户 ID、用户名、关键词、国家或负责人" /></label>
      <label class="field"><span>分类</span><select id="category"><option value="">全部分类</option><option value="ad_account">投放账户</option><option value="platform_login">平台账号</option><option value="link_resource">链接资源</option></select></label>
      <button class="secondary" id="importButton" type="button">导入 Excel</button><input id="importFile" type="file" accept=".xlsx" hidden />
      <button class="secondary" id="exportButton" type="button">导出 Excel</button>
      <button class="primary" id="addButton" type="button">新增资料</button>
    </section>
    <div id="status" class="status"></div>
    <section class="table-shell"><table><thead><tr><th>分类 / 名称</th><th>账户信息</th><th>关键词 / 地区</th><th>channel / style</th><th>网址</th><th>密码 / Token</th><th>负责人 / 备注</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>还没有账户资料</div></section>
    <div class="pagination"><button class="secondary" id="prev" type="button">上一页</button><span id="pageInfo">第 1 页</span><button class="secondary" id="next" type="button">下一页</button></div>
  </main>
  <dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle">新增资料</h2><button class="close" id="closeEditor" type="button" aria-label="关闭">×</button></div><div class="dialog-body"><div class="form-grid">
    <label class="field"><span>分类</span><select id="editCategory" required><option value="ad_account">投放账户</option><option value="platform_login">平台账号</option><option value="link_resource">链接资源</option></select></label>
    <label class="field"><span>名称</span><input id="editName" required maxlength="255" /></label>
    <label class="field"><span>账户 ID</span><input id="editAccountId" maxlength="255" /></label>
    <label class="field"><span>用户名</span><input id="editUsername" maxlength="500" autocomplete="off" /></label>
    <label class="field span-2"><span>密码或 Token</span><div class="secret-row"><input id="editSecret" type="password" maxlength="5000" autocomplete="new-password" placeholder="编辑时留空表示保持原值" /><button class="secondary" id="toggleEditSecret" type="button">显示</button></div></label>
    <label class="field span-2"><span>网址</span><input id="editUrl" type="url" maxlength="2000" placeholder="https://" /></label>
    <label class="field"><span>关键词</span><input id="editKeyword" maxlength="1000" /></label>
    <label class="field"><span>国家 / 地区</span><input id="editCountry" maxlength="255" /></label>
    <label class="field"><span>channel</span><input id="editChannel" maxlength="255" /></label>
    <label class="field"><span>style ID</span><input id="editStyle" maxlength="255" /></label>
    <label class="field"><span>负责人</span><input id="editOwner" maxlength="255" /></label>
    <label class="field span-2"><span>备注</span><textarea id="editNotes" maxlength="5000"></textarea></label>
  </div></div><div class="dialog-actions"><button class="secondary" id="cancelEditor" type="button">取消</button><button class="primary" id="saveButton" type="submit">保存</button></div></form></dialog>
  <dialog id="importDialog"><div class="dialog-head"><h2>导入 Excel</h2><button class="close" id="closeImport" type="button" aria-label="关闭">×</button></div><div class="dialog-body"><p class="import-note">支持当前“关键词.xlsx”的关键词账户表、账户名称与 ID 对照表，也支持从本工具导出的标准模板。导入会新增资料，不覆盖已有记录。</p><div id="importFilename" class="meta"></div></div><div class="dialog-actions"><button class="secondary" id="cancelImport" type="button">取消</button><button class="primary" id="confirmImport" type="button">开始导入</button></div></dialog>
  <script>
    const $=s=>document.querySelector(s),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let entries=[],page=1,pages=1,editingId=0,searchTimer,selectedFile;
    async function api(url,options={}){const r=await fetch(url,options);const p=await r.json().catch(()=>({error:`请求失败（HTTP ${r.status}）`}));if(r.status===401){location.replace('/login');throw Error('登录已失效')}if(r.status===403){location.replace('/tools');throw Error('仅管理员可使用')}if(!r.ok)throw Error(p.error||`请求失败（HTTP ${r.status}）`);return p}
    function status(message,type=''){$('#status').textContent=message;$('#status').className=`status ${type}`}
    function display(value){return value?esc(value):'<span class="meta">未填写</span>'}
    function render(){const body=$('#rows');body.innerHTML=entries.map(e=>`<tr data-id="${e.id}"><td data-label="分类 / 名称"><span class="category">${esc(e.categoryLabel)}</span><div class="name">${esc(e.name)}</div><div class="meta">更新：${esc((e.updatedAt||'').replace('T',' '))}</div></td><td data-label="账户信息"><div>${display(e.accountId)}</div><div class="meta">${display(e.username)}</div></td><td data-label="关键词 / 地区"><div>${display(e.keyword)}</div><div class="meta">${display(e.country)}</div></td><td data-label="channel / style"><div>${display(e.channelId)}</div><div class="meta">${display(e.styleId)}</div></td><td data-label="网址">${e.url?`<a class="link" href="${esc(e.url)}" target="_blank" rel="noopener">打开链接</a>`:'<span class="meta">未填写</span>'}</td><td data-label="密码 / Token"><span class="secret" data-secret>${esc(e.secretMasked||'未设置')}</span>${e.secretConfigured?`<div class="actions"><button class="mini" type="button" data-reveal="${e.id}">查看</button><button class="mini" type="button" data-copy-secret="${e.id}">复制</button></div>`:''}</td><td data-label="负责人 / 备注"><div>${display(e.owner)}</div><div class="meta">${display(e.notes)}</div></td><td data-label="操作"><div class="actions"><button class="mini" type="button" data-edit="${e.id}">编辑</button><button class="mini delete" type="button" data-delete="${e.id}">删除</button></div></td></tr>`).join('');$('#empty').hidden=entries.length>0;$('#pageInfo').textContent=`第 ${page} / ${pages} 页`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages}
    async function load(){try{status('正在加载...');const params=new URLSearchParams({query:$('#query').value.trim(),category:$('#category').value,page,pageSize:20});const data=await api(`/api/account-vault?${params}`);entries=data.entries||[];pages=data.pages||1;page=data.page||1;render();status(`共 ${data.total||0} 条资料`)}catch(e){status(e.message,'error')}}
    function payload(){return{category:$('#editCategory').value,name:$('#editName').value.trim(),accountId:$('#editAccountId').value.trim(),username:$('#editUsername').value.trim(),secret:$('#editSecret').value,url:$('#editUrl').value.trim(),keyword:$('#editKeyword').value.trim(),channelId:$('#editChannel').value.trim(),styleId:$('#editStyle').value.trim(),country:$('#editCountry').value.trim(),owner:$('#editOwner').value.trim(),notes:$('#editNotes').value.trim()}}
    function openEditor(entry){editingId=entry?.id||0;$('#editorTitle').textContent=editingId?'编辑资料':'新增资料';$('#editCategory').value=entry?.category||'ad_account';$('#editName').value=entry?.name||'';$('#editAccountId').value=entry?.accountId||'';$('#editUsername').value=entry?.username||'';$('#editSecret').value='';$('#editSecret').type='password';$('#toggleEditSecret').textContent='显示';$('#editUrl').value=entry?.url||'';$('#editKeyword').value=entry?.keyword||'';$('#editChannel').value=entry?.channelId||'';$('#editStyle').value=entry?.styleId||'';$('#editCountry').value=entry?.country||'';$('#editOwner').value=entry?.owner||'';$('#editNotes').value=entry?.notes||'';$('#editor').showModal();setTimeout(()=>$('#editName').focus(),0)}
    async function secret(id){return(await api(`/api/account-vault/${id}/secret`)).secret||''}
    $('#query').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;load()},250)};$('#category').onchange=()=>{page=1;load()};$('#prev').onclick=()=>{if(page>1){page--;load()}};$('#next').onclick=()=>{if(page<pages){page++;load()}};
    $('#addButton').onclick=()=>openEditor();$('#closeEditor').onclick=$('#cancelEditor').onclick=()=>$('#editor').close();$('#toggleEditSecret').onclick=()=>{const input=$('#editSecret'),show=input.type==='password';input.type=show?'text':'password';$('#toggleEditSecret').textContent=show?'隐藏':'显示'};
    $('#editorForm').onsubmit=async event=>{event.preventDefault();const button=$('#saveButton');try{button.disabled=true;const data=await api(editingId?`/api/account-vault/${editingId}`:'/api/account-vault',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});$('#editor').close();status('账户资料已保存','ok');await load()}catch(e){status(e.message,'error')}finally{button.disabled=false}};
    $('#rows').onclick=async event=>{if(event.target.dataset.hide){const id=Number(event.target.dataset.hide),entry=entries.find(item=>item.id===id),target=event.target.closest('td').querySelector('[data-secret]');target.textContent=entry?.secretMasked||'未设置';event.target.textContent='查看';event.target.dataset.reveal=String(id);delete event.target.dataset.hide;return}const id=Number(event.target.dataset.edit||event.target.dataset.delete||event.target.dataset.reveal||event.target.dataset.copySecret);if(!id)return;const entry=entries.find(item=>item.id===id);try{if(event.target.dataset.edit){openEditor(entry);return}if(event.target.dataset.delete){if(!confirm(`确定删除“${entry.name}”吗？`))return;await api(`/api/account-vault/${id}`,{method:'DELETE'});status('资料已删除','ok');await load();return}const value=await secret(id);if(event.target.dataset.copySecret){await navigator.clipboard.writeText(value);status('密码或 Token 已复制','ok')}else{const target=event.target.closest('td').querySelector('[data-secret]');target.textContent=value||'未设置';event.target.textContent='隐藏';delete event.target.dataset.reveal;event.target.dataset.hide=String(id);setTimeout(()=>{target.textContent=entry.secretMasked||'未设置';event.target.textContent='查看';event.target.dataset.reveal=String(id);delete event.target.dataset.hide},30000)}}catch(e){status(e.message,'error')}};
    $('#importButton').onclick=()=>$('#importFile').click();$('#importFile').onchange=()=>{selectedFile=$('#importFile').files[0];if(!selectedFile)return;$('#importFilename').textContent=selectedFile.name;$('#importDialog').showModal()};$('#closeImport').onclick=$('#cancelImport').onclick=()=>$('#importDialog').close();$('#confirmImport').onclick=async()=>{const button=$('#confirmImport');try{button.disabled=true;const form=new FormData();form.append('file',selectedFile);const result=await api('/api/account-vault/import',{method:'POST',body:form});$('#importDialog').close();$('#importFile').value='';status(`成功导入 ${result.imported} 条资料`,'ok');page=1;await load()}catch(e){status(e.message,'error')}finally{button.disabled=false}};
    $('#exportButton').onclick=()=>{location.href='/api/account-vault/export'};$('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};load();
  </script>
</body>
</html>
