<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok账户看板</title>
  <script>fetch('/api/session',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{window.__USER__=s.user;document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <script src="/report-visibility.js"></script>
  <script src="/echarts.min.js"></script>
  <style>
    :root{--blue:#1677ff;--blue-soft:#eaf3ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--good:#067647;--bad:#b42318;--warning:#b54708}*{box-sizing:border-box}html:not(.authenticated) body{visibility:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.62}header{padding:18px 28px 14px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:6px;background:#1f2937;color:#fff;font-weight:700}h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:6px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a,.nav button,.secondary{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font-weight:600;line-height:32px;white-space:nowrap}.nav button,.secondary{line-height:normal}.nav a:hover,.nav button:hover,.secondary:hover{border-color:var(--blue);background:var(--blue-soft)}main{padding:18px 28px 40px}.panel{margin-bottom:16px;padding:16px;border:1px solid var(--line);background:#fff}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-head h2{margin:0;font-size:16px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.admin-panel{display:none}.admin .admin-panel{display:block}.credential-grid,.sync-grid,.filter-grid{display:grid;align-items:end;gap:10px}.credential-grid{grid-template-columns:minmax(260px,2fr) minmax(220px,1fr) auto}.sync-grid{grid-template-columns:180px 180px auto;justify-content:start;margin-top:12px}.filter-grid{grid-template-columns:180px 180px minmax(230px,1fr) 160px auto auto auto}.field{display:grid;gap:6px}.field span{font-size:12px;font-weight:600;color:#475467}.field input,.field select{width:100%;height:38px;min-width:0;padding:0 10px;border:1px solid #b9c9d9;border-radius:5px;background:#fff;color:var(--ink)}.toggle{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid #b9c9d9;border-radius:5px;background:#fff;white-space:nowrap}.toggle input{width:16px;height:16px;accent-color:var(--blue)}.primary{height:38px;padding:0 14px;border:0;border-radius:5px;background:var(--blue);color:#fff;font-weight:600;white-space:nowrap}.primary:hover{background:#0958d9}.sync-meta,.status{min-height:20px;margin-top:10px;color:var(--muted);font-size:12px}.status.ok{color:var(--good)}.status.error{color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}.metric{min-width:0;padding:14px;border:1px solid var(--line);background:#fff}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:7px;overflow:hidden;color:var(--ink);font-size:22px;line-height:1.15;text-overflow:ellipsis}.metric.primary-metric strong{color:#1756a9}.metric.good strong{color:var(--good)}.metric small{display:block;margin-top:5px;color:var(--muted)}.chart-panel{padding-bottom:8px}.chart{width:100%;height:260px}.workspace{border:1px solid var(--line);background:#fff}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.tabs{display:flex;padding:3px;border:1px solid #d7e0ea;border-radius:6px;background:#f7f9fc}.tab{height:32px;padding:0 13px;border:0;border-radius:4px;background:transparent;color:#475467}.tab.active{background:#fff;color:#1677ff;box-shadow:0 1px 3px rgba(23,43,77,.12)}.table-meta{color:var(--muted);font-size:12px}.table-shell{max-height:calc(100vh - 300px);min-height:160px;overflow:auto}.table-shell.is-loading{opacity:.62;cursor:progress}table{width:100%;min-width:1040px;border-collapse:collapse;table-layout:fixed}th,td{padding:11px 12px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:middle;line-height:1.45}th{position:sticky;z-index:2;top:0;background:#f8fafc;color:#475467;font-size:12px;white-space:nowrap}tbody tr:hover td{background:#f7fbff}.account{font-weight:600}.account-id{display:inline-block;margin-top:2px;color:#1756a9;font:12px ui-monospace,Consolas,monospace;text-decoration:none}.account-id:hover{text-decoration:underline}.number{text-align:right;font-variant-numeric:tabular-nums}.spend{color:#1756a9;font-weight:700}.badge{display:inline-flex;align-items:center;height:23px;padding:0 7px;border-radius:4px;background:#edf2f7;color:#475467;font-size:12px}.badge.enabled{background:#ecfdf3;color:var(--good)}.badge.disabled{background:#fef3f2;color:var(--bad)}.empty{display:grid;min-height:220px;place-items:center;padding:30px;color:var(--muted);text-align:center}.empty[hidden]{display:none}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.pagination span{color:var(--muted);font-size:12px}.pagination[hidden]{display:none}.mini{height:32px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;font-weight:600}.mini:hover{border-color:var(--blue);background:var(--blue-soft)}
    @media(max-width:1180px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.credential-grid{grid-template-columns:1fr 1fr auto}.credential-grid .save-config{grid-column:3}.filter-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.filter-grid .search-field{grid-column:span 2}}
    @media(max-width:760px){body{overflow-x:hidden}header{padding:15px}.header-row{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.nav a,.nav button{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 7px;text-align:center}main{padding:12px}.panel{padding:14px}.panel-head{align-items:flex-start;flex-direction:column}.credential-grid,.sync-grid,.filter-grid{grid-template-columns:1fr 1fr}.credential-grid .token-field,.filter-grid .search-field{grid-column:1/-1}.credential-grid .save-config{grid-column:auto}.credential-grid button,.sync-grid button,.filter-grid button{width:100%}.summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:12px}.metric strong{font-size:19px}.chart{height:220px}.workspace-head{align-items:stretch;flex-direction:column}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.tab{padding:0 5px;font-size:12px}.table-shell{max-height:none;min-height:0;overflow:visible}table,tbody{display:block;min-width:0}thead{display:none}tr{display:block;margin:10px;padding:8px 12px;border:1px solid var(--line);background:#fff}td{display:grid;grid-template-columns:88px minmax(0,1fr);padding:7px 0;border:0;text-align:left!important}td::before{content:attr(data-label);color:var(--muted);font-size:12px}.pagination{justify-content:space-between}}
    @media(max-width:760px){.sync-grid .primary{grid-column:1/-1}}
    @media(max-width:420px){.credential-grid,.sync-grid,.filter-grid{grid-template-columns:1fr}.credential-grid .token-field,.filter-grid .search-field{grid-column:auto}.summary{grid-template-columns:1fr 1fr}.nav{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">投</span><h1>TikTok账户看板</h1></div><p>ADPFlux 账户消耗、余额、点击与转化数据，按日期快照保存。</p></div><nav class="nav"><a href="/">大航海日报</a><a href="/jd">京东广义新</a><a href="/jd-low-activity">京东低活</a><a href="/tools">工具中心</a><a href="/account">设置</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main>
    <section class="panel admin-panel" id="adminPanel"><div class="panel-head"><div><h2>上游数据同步</h2><p>凭据只保存在服务器；留空表示继续使用已保存值。同步日期与下方报表查询范围互不影响。</p></div></div><div class="credential-grid"><label class="field token-field"><span>AuthorizationFront</span><input id="token" type="password" autocomplete="off" placeholder="留空使用服务器已保存的凭据" /></label><label class="field"><span>CompanyExID</span><input id="companyId" inputmode="numeric" placeholder="输入公司 ID" /></label><button class="secondary save-config" id="saveConfig" type="button">保存配置</button></div><div class="sync-grid"><label class="field"><span>同步开始日期</span><input id="syncStart" type="date" /></label><label class="field"><span>同步结束日期</span><input id="syncEnd" type="date" /></label><button class="primary" id="sync" type="button">同步上游数据</button></div><div class="sync-meta" id="syncMeta">正在读取服务器配置...</div></section>

    <section class="panel"><div class="filter-grid"><label class="field"><span>开始日期</span><input id="start" type="date" /></label><label class="field"><span>结束日期</span><input id="end" type="date" /></label><label class="field search-field"><span>账户搜索</span><input id="query" placeholder="输入账户名称或账户 ID" /></label><label class="field"><span>账户状态</span><select id="accountStatus"><option value="all">全部状态</option><option value="enabled">已启用</option><option value="disabled">未启用</option></select></label><label class="toggle"><input id="spendingOnly" type="checkbox" /><span>只看有消耗</span></label><button class="primary" id="apply" type="button">应用筛选</button><button class="secondary" id="reset" type="button">重置</button></div><div class="status" id="status" role="status" aria-live="polite"></div></section>

    <section class="summary" id="summary"><article class="metric primary-metric"><span>总消耗</span><strong id="totalSpend">0.00</strong><small id="currencyHint">金额单位：USD</small></article><article class="metric"><span>有消耗账户</span><strong id="spendingAccounts">0</strong><small id="accountHint">共 0 个账户</small></article><article class="metric"><span>点击</span><strong id="clicks">0</strong><small>所选日期累计</small></article><article class="metric"><span>转化</span><strong id="conversions">0</strong><small>所选日期累计</small></article><article class="metric"><span>平均 CPA</span><strong id="cpa">0.00</strong><small>总消耗 / 转化</small></article><article class="metric good"><span>最新账户余额</span><strong id="totalBalance">0.00</strong><small>每个账户取最新日期</small></article></section>

    <section class="panel chart-panel"><div class="panel-head"><div><h2>每日消耗</h2><p id="rangeText">暂无数据</p></div></div><div class="chart" id="chart"></div></section>

    <section class="workspace"><div class="workspace-head"><div class="tabs" role="tablist"><button class="tab active" data-view="by_account" type="button">账户汇总</button><button class="tab" data-view="by_date" type="button">日期汇总</button><button class="tab" data-view="by_account_date" type="button">账户日期明细</button></div><div class="table-meta"><span id="rowCount">0 条数据</span> · <button class="mini" id="export" type="button">导出当前表</button></div></div><div class="table-shell" id="tableShell"><table id="table"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table><div class="empty" id="empty" hidden><div><strong>当前范围没有数据</strong><p>请调整筛选条件，或由管理员先同步上游数据。</p></div></div></div><div class="pagination" id="pagination" hidden><button class="mini" id="prev" type="button">上一页</button><span id="pageInfo">第 1 / 1 页</span><button class="mini" id="next" type="button">下一页</button></div></section>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let report={summary:{},by_account:[],by_date:[],by_account_date:[]},view='by_account',page=1,pageSize=20,chart;
    const views={by_account:{columns:[['advertiserName','账户'],['latestDate','最新日期'],['status','状态'],['totalSpend','总消耗','number'],['balance','余额','number'],['clicks','点击','number'],['conversions','转化','number'],['cpa','CPA','number'],['cvr','CVR','number'],['timezone','时区']]},by_date:{columns:[['date','日期'],['accounts','账户数','number'],['totalSpend','总消耗','number'],['clicks','点击','number'],['conversions','转化','number'],['cpa','CPA','number'],['cvr','CVR','number'],['billedCost','账单消耗','number'],['cashSpend','现金消耗','number'],['voucherSpend','赠款消耗','number']]},by_account_date:{columns:[['date','日期'],['advertiserName','账户'],['status','状态'],['totalSpend','消耗','number'],['balance','余额','number'],['clicks','点击','number'],['conversions','转化','number'],['cpa','CPA','number'],['cvr','CVR','number'],['timezone','时区']]}};
    function localDate(date=new Date()){const copy=new Date(date.getTime()-date.getTimezoneOffset()*60000);return copy.toISOString().slice(0,10)}
    function number(value,digits=2){return Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits})}
    function integer(value){return Number(value||0).toLocaleString('zh-CN',{maximumFractionDigits:0})}
    function setStatus(message,type=''){const node=$('#status');node.textContent=message;node.className=`status ${type}`}
    async function api(url,options={}){const response=await fetch(url,{cache:'no-store',headers:{...(options.body&&!(options.body instanceof FormData)?{'Content-Type':'application/json'}:{}),...(options.headers||{})},...options});if(response.status===401){location.replace('/login');throw Error('登录已失效')}const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{throw Error(`服务器返回格式错误（HTTP ${response.status}）`)}if(!response.ok)throw Error(data.message||data.error||`请求失败（HTTP ${response.status}）`);return data}
    function setBusy(button,busy,label){if(!button.dataset.label)button.dataset.label=button.textContent;button.disabled=busy;button.textContent=busy?label:button.dataset.label}
    function accountLink(row){const id=esc(row.advertiserId),date=esc(row.latestDate||row.date||localDate());return `<div class="account">${esc(row.advertiserName||`账户 ${id}`)}</div><a class="account-id" href="https://ads.tiktok.com/i18n/manage/campaign?aadvid=${encodeURIComponent(row.advertiserId)}&navigate_from=dashboard&relative_time=today&st=${date}&et=${date}" target="_blank" rel="noopener">${id}</a>`}
    function statusBadge(row){const enabled=Number(row.status)===1;return `<span class="badge ${enabled?'enabled':'disabled'}">${enabled?'已启用':'未启用'}</span>`}
    function cell(row,key){if(key==='advertiserName')return accountLink(row);if(key==='status')return statusBadge(row);if(key==='cvr')return `${number(row[key])}%`;if(['totalSpend','balance','cpa','billedCost','cashSpend','voucherSpend'].includes(key))return number(row[key]);if(['clicks','conversions','accounts'].includes(key))return integer(row[key]);return esc(row[key]||'-')}
    function renderSummary(){const summary=report.summary||{};$('#totalSpend').textContent=number(summary.totalSpend);$('#spendingAccounts').textContent=integer(summary.spendingAccounts);$('#accountHint').textContent=`共 ${integer(summary.accounts)} 个账户`;$('#clicks').textContent=integer(summary.clicks);$('#conversions').textContent=integer(summary.conversions);$('#cpa').textContent=number(summary.cpa);$('#totalBalance').textContent=number(summary.totalBalance);const currencies=[...(report.currencies||[])];$('#currencyHint').textContent=currencies.length?`金额单位：${currencies.join(' / ')}`:'金额单位：以上游返回为准';$('#rangeText').textContent=(report.range||[]).length===2?`${report.range[0]} 至 ${report.range[1]}`:'暂无数据'}
    function renderChart(){if(!chart)chart=echarts.init($('#chart'));const rows=[...(report.by_date||[])].reverse();chart.setOption({animationDuration:240,grid:{left:48,right:18,top:18,bottom:42},tooltip:{trigger:'axis',valueFormatter:value=>number(value)},xAxis:{type:'category',data:rows.map(row=>row.date),axisLabel:{color:'#667085',hideOverlap:true}},yAxis:{type:'value',name:'消耗',nameTextStyle:{color:'#667085'},axisLabel:{color:'#667085'},splitLine:{lineStyle:{color:'#edf1f5'}}},series:[{name:'总消耗',type:'line',smooth:.22,symbolSize:7,data:rows.map(row=>row.totalSpend),lineStyle:{width:3,color:'#1677ff'},itemStyle:{color:'#1677ff'},areaStyle:{color:'rgba(22,119,255,.08)'}}]},{notMerge:true})}
    function renderTable(){const config=views[view],rows=report[view]||[],pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);const visible=rows.slice((page-1)*pageSize,page*pageSize);$('#tableHead').innerHTML=`<tr>${config.columns.map(column=>`<th class="${column[2]||''}">${column[1]}</th>`).join('')}</tr>`;$('#tableBody').innerHTML=visible.map(row=>`<tr>${config.columns.map(column=>`<td data-label="${column[1]}" class="${column[2]||''}${column[0]==='totalSpend'?' spend':''}">${cell(row,column[0])}</td>`).join('')}</tr>`).join('');$('#table').hidden=!rows.length;$('#empty').hidden=!!rows.length;$('#pagination').hidden=rows.length<=pageSize;$('#pageInfo').textContent=`第 ${page} / ${pages} 页`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages;$('#rowCount').textContent=`${integer(rows.length)} 条数据`}
    function render(){renderSummary();renderChart();renderTable()}
    async function analyze(){const button=$('#apply');setBusy(button,true,'查询中...');$('#tableShell').classList.add('is-loading');try{report=await api('/api/adpflux/analyze',{method:'POST',body:JSON.stringify({start:$('#start').value,end:$('#end').value,query:$('#query').value.trim(),status:$('#accountStatus').value,spendingOnly:$('#spendingOnly').checked})});page=1;render();const cached=report.cachedAt?report.cachedAt.replace('T',' '):'尚未同步';setStatus(`已读取 ${integer(report.rows)} 条每日账户快照，最近同步：${cached}`,'ok')}catch(error){setStatus(error.message,'error')}finally{setBusy(button,false);$('#tableShell').classList.remove('is-loading')}}
    async function loadSettings(){if(!document.documentElement.classList.contains('admin'))return;try{const saved=await api('/api/adpflux/settings');$('#companyId').value=saved.companyId||'';$('#syncMeta').textContent=saved.configured?'服务器已保存完整凭据，每天 09:20 自动同步前一天数据。':'配置尚不完整，请填写凭据后保存。'}catch(error){$('#syncMeta').textContent=error.message}}
    function csvEscape(value){const text=String(value??'');return /[",\n]/.test(text)?`"${text.replaceAll('"','""')}"`:text}
    function exportCsv(){const config=views[view],rows=report[view]||[];if(!rows.length){setStatus('当前表没有可导出的数据','error');return}const csv='\ufeff'+[config.columns.map(column=>column[1]),...rows.map(row=>config.columns.map(column=>row[column[0]]??''))].map(line=>line.map(csvEscape).join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download=`TikTok账户看板_${view}_${$('#start').value}_${$('#end').value}.csv`;link.click();URL.revokeObjectURL(link.href);setStatus('当前表已导出','ok')}
    async function initialize(){const today=localDate();$('#syncStart').value=today;$('#syncEnd').value=today;$('#start').value=today;$('#end').value=today;for(let i=0;i<30&&!window.__USER__;i++)await new Promise(resolve=>setTimeout(resolve,50));if(window.__USER__?.role==='admin')document.documentElement.classList.add('admin');await Promise.all([analyze(),loadSettings()]);window.addEventListener('resize',()=>chart?.resize())}
    $('#apply').onclick=analyze;$('#query').onkeydown=event=>{if(event.key==='Enter')analyze()};$('#reset').onclick=()=>{const today=localDate();$('#start').value=today;$('#end').value=today;$('#query').value='';$('#accountStatus').value='all';$('#spendingOnly').checked=false;analyze()};$('#saveConfig').onclick=async()=>{const button=$('#saveConfig');setBusy(button,true,'保存中...');try{const result=await api('/api/adpflux/settings',{method:'POST',body:JSON.stringify({token:$('#token').value.trim(),companyId:$('#companyId').value.trim()})});$('#token').value='';$('#companyId').value=result.companyId||$('#companyId').value;$('#syncMeta').textContent='配置已保存到服务器。';setStatus('接口配置已保存','ok')}catch(error){setStatus(error.message,'error')}finally{setBusy(button,false)}};$('#sync').onclick=async()=>{const button=$('#sync');setBusy(button,true,'同步中...');setStatus(`正在同步 ${$('#syncStart').value} 至 ${$('#syncEnd').value} 的上游数据，请稍候...`);try{report=await api('/api/adpflux/sync',{method:'POST',body:JSON.stringify({start:$('#syncStart').value,end:$('#syncEnd').value,token:$('#token').value.trim(),companyId:$('#companyId').value.trim()})});$('#token').value='';page=1;render();setStatus(`同步完成，已保存 ${integer(report.rows)} 条每日账户快照`,'ok');await loadSettings()}catch(error){setStatus(error.message,'error')}finally{setBusy(button,false)}};document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));view=button.dataset.view;page=1;renderTable()});$('#prev').onclick=()=>{page--;renderTable()};$('#next').onclick=()=>{page++;renderTable()};$('#export').onclick=exportCsv;$('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};initialize();
  </script>
</body>
</html>
