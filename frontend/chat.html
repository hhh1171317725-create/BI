<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}html:not(.admin) .admin-only{display:none!important}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject()).then(result=>{document.documentElement.classList.add('authenticated');if(result.user?.role==='admin')document.documentElement.classList.add('admin')}).catch(()=>location.replace('/login'));</script>
  <title>聊天室</title>
  <script src="/report-visibility.js"></script>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--mine:#eaf3ff;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}header{padding:18px 32px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:var(--blue);color:#fff;font-weight:700}h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button{line-height:normal}.nav a:hover,.nav button:hover{border-color:var(--blue);background:#eaf3ff}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;margin:18px 32px}.panel{padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff}.settings{display:grid;gap:12px;align-content:start}label{display:grid;gap:7px;color:#475467;font-weight:600}input,textarea{width:100%;padding:9px 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:var(--ink);font:inherit}input{height:36px}textarea{min-height:82px;resize:vertical}.note{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:calc(100vh - 150px);min-height:560px;overflow:hidden}.chat-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #edf1f5}.chat-head h2{margin:0;font-size:16px}.status{color:var(--muted);font-size:12px}.status.error{color:var(--bad)}.messages{min-height:0;padding:16px 4px;overflow:auto;display:flex;flex-direction:column;gap:12px}.message{max-width:min(760px,86%);padding:11px 13px;border:1px solid #e3eaf2;border-radius:7px;background:#fff}.message.mine{align-self:flex-end;background:var(--mine);border-color:#c9dcf7}.message-meta{display:flex;gap:8px;color:var(--muted);font-size:12px}.message-text{margin-top:7px;white-space:pre-wrap;word-break:break-word}.attachment{display:flex;align-items:center;gap:8px;margin-top:9px}.attachment a{color:#1756a9;font-weight:600;text-decoration:none;word-break:break-all}.attachment img{display:block;max-width:min(320px,100%);max-height:260px;border:1px solid #d9e2ec;border-radius:5px}.composer{display:grid;gap:10px;padding-top:12px;border-top:1px solid #edf1f5}.composer-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.file-label{display:flex;align-items:center;gap:8px;color:#475467;font-size:12px;font-weight:600}.file-label input{width:auto;height:auto}.file-name{color:var(--muted);font-size:12px}.primary{height:36px;padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}@media(max-width:850px){header,.layout{margin-left:16px;margin-right:16px}.header-row{align-items:flex-start}.layout{grid-template-columns:1fr}.chat{height:600px;min-height:0}}@media(max-width:700px){body{overflow-x:hidden}header{margin:0;padding:16px}.header-row{flex-direction:column;gap:14px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:8px}.nav a,.nav button{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 8px;text-align:center}h1{font-size:20px}.layout{gap:10px;margin:12px}.panel{padding:14px}.settings{gap:10px}.chat{height:70dvh;min-height:500px}.messages{padding:12px 2px}.message{max-width:92%;padding:10px 11px}.message-meta{flex-wrap:wrap;gap:4px 8px}.composer-row{display:grid;grid-template-columns:1fr}.file-label{min-width:0;flex-wrap:wrap}.file-name{max-width:100%;overflow-wrap:anywhere}.primary{width:100%}}@media(max-width:360px){.nav{grid-template-columns:1fr}}
    .danger{height:36px;padding:0 12px;border:1px solid #e3a7a7;border-radius:5px;background:#fff;color:#b42318;font:600 13px inherit;cursor:pointer}.danger:hover{border-color:var(--bad);background:#fff1f0}.danger:disabled{opacity:.5;cursor:wait}@media(max-width:700px){.danger{width:100%}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">聊</span><h1>聊天室</h1></div><p>已登录设备可共享文字、图片和文件。</p></div><nav class="nav"><a href="/tools">工具中心</a><a href="/">大航海日报</a><a href="/jd">京东广义新</a><a href="/jd-low-activity">京东低活</a><a href="/account">设置</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main class="layout"><aside class="panel settings"><label>房间名称<input id="room" maxlength="32" value="公共聊天室" /></label><label>设备昵称<input id="sender" maxlength="32" placeholder="例如：宏辉电脑" /></label><p class="note">房间与昵称仅保存在当前浏览器。消息和文件保存在服务器运行目录，文件大小上限为 50MB。</p><button class="danger admin-only" id="clearRoom" type="button">清空当前房间</button></aside><section class="panel chat"><div class="chat-head"><h2 id="roomTitle">公共聊天室</h2><span class="status" id="status">正在连接…</span></div><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="composer"><textarea id="text" maxlength="4000" placeholder="输入消息，或选择文件后发送…"></textarea><div class="composer-row"><label class="file-label">选择文件<input id="file" type="file" /><span class="file-name" id="fileName">未选择文件</span></label><button class="primary" id="send" type="submit">发送</button></div></form></section></main>
  <script>
    const $=selector=>document.querySelector(selector),settingsKey='marketing-report-chat-settings-v1';let knownIds='',poller;
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    function readSettings(){try{return JSON.parse(localStorage.getItem(settingsKey)||'{}')}catch{return{}}}
    function saveSettings(){localStorage.setItem(settingsKey,JSON.stringify({room:$('#room').value.trim(),sender:$('#sender').value.trim()}))}
    function setStatus(message,tone=''){const status=$('#status');status.textContent=message;status.className=`status ${tone}`}
    async function request(url,options={}){const response=await fetch(url,options);if(response.status===401){location.replace('/login');throw Error('登录已失效')}const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    function room(){return $('#room').value.trim()||'公共聊天室'}
    function sender(){return $('#sender').value.trim()||'匿名设备'}
    function formatSize(size){if(size<1024)return `${size} B`;if(size<1024*1024)return `${(size/1024).toFixed(1)} KB`;return `${(size/1024/1024).toFixed(1)} MB`}
    function scrollToLatest(container){const scroll=()=>{container.scrollTop=container.scrollHeight};requestAnimationFrame(()=>{scroll();requestAnimationFrame(scroll)});setTimeout(scroll,80)}
    function render(messages){const ids=messages.map(message=>message.id).join(',');if(ids===knownIds)return;const container=$('#messages'),atBottom=container.scrollHeight-container.scrollTop-container.clientHeight<50,firstLoad=!container.dataset.loaded,shouldScroll=atBottom||firstLoad;knownIds=ids;container.innerHTML=messages.map(message=>{const mine=message.sender===sender(),attachment=message.attachment;if(!attachment)return`<article class="message ${mine?'mine':''}"><div class="message-meta"><span>${esc(message.sender)}</span><span>${new Date(message.createdAt).toLocaleString('zh-CN')}</span></div><div class="message-text">${esc(message.text)}</div></article>`;const url=`/api/chat/files/${encodeURIComponent(attachment.id)}`,image=String(attachment.contentType||'').startsWith('image/'),content=image?`<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(attachment.name)}" /></a>`:`<a href="${url}" download>${esc(attachment.name)}（${formatSize(attachment.size)}）</a>`;return`<article class="message ${mine?'mine':''}"><div class="message-meta"><span>${esc(message.sender)}</span><span>${new Date(message.createdAt).toLocaleString('zh-CN')}</span></div>${message.text?`<div class="message-text">${esc(message.text)}</div>`:''}<div class="attachment">${content}</div></article>`}).join('');if(shouldScroll){scrollToLatest(container);container.querySelectorAll('img').forEach(image=>image.addEventListener('load',()=>scrollToLatest(container),{once:true}))}container.dataset.loaded='true'}
    async function refresh(){try{const payload=await request(`/api/chat/messages?room=${encodeURIComponent(room())}`);$('#roomTitle').textContent=payload.room;render(payload.messages||[]);setStatus(`已同步 ${payload.messages?.length||0} 条消息`)}catch(error){setStatus(error.message,'error')}}
    async function send(event){event.preventDefault();const file=$('#file').files[0],text=$('#text').value.trim();if(!file&&!text)return;const button=$('#send');try{button.disabled=true;button.textContent='发送中…';if(file){if(file.size>50*1024*1024)throw Error('文件不能超过 50MB');const body=new FormData();body.append('room',room());body.append('sender',sender());body.append('text',text);body.append('file',file);await request('/api/chat/upload',{method:'POST',body})}else await request('/api/chat/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:room(),sender:sender(),text})});$('#text').value='';$('#file').value='';$('#fileName').textContent='未选择文件';saveSettings();await refresh()}catch(error){setStatus(error.message,'error')}finally{button.disabled=false;button.textContent='发送'}}
    function changeRoom(){saveSettings();knownIds='';$('#messages').replaceChildren();refresh()}
    async function clearRoom(){const currentRoom=room();if(!confirm(`确定清空“${currentRoom}”的全部聊天记录和附件吗？此操作无法撤销。`))return;const button=$('#clearRoom');try{button.disabled=true;const result=await request(`/api/chat/messages?room=${encodeURIComponent(currentRoom)}`,{method:'DELETE'});knownIds='';$('#messages').replaceChildren();await refresh();setStatus(`已清理 ${result.messagesDeleted||0} 条消息和 ${result.filesDeleted||0} 个文件${result.fileDeleteFailures?`，${result.fileDeleteFailures} 个文件清理失败`:''}`,result.fileDeleteFailures?'error':'')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false}}
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};$('#clearRoom').onclick=clearRoom;$('#composer').onsubmit=send;$('#file').onchange=()=>{$('#fileName').textContent=$('#file').files[0]?.name||'未选择文件'};$('#room').onchange=changeRoom;$('#sender').onchange=saveSettings;const saved=readSettings();$('#room').value=saved.room||'公共聊天室';$('#sender').value=saved.sender||'';refresh();poller=setInterval(refresh,3000);window.addEventListener('beforeunload',()=>clearInterval(poller));
  </script>
</body>
</html>
