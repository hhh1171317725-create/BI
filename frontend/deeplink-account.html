<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <title>通投账户取链</title>
  <script src="/report-visibility.js"></script>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--bad:#b42318;--good:#067647}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}
    header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:#1f2937;color:#fff;font-weight:700}h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:7px 0 0;color:var(--muted)}
    .nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button{line-height:normal}.nav a:hover,.nav button:hover{border-color:var(--blue);background:#eaf3ff}
    main{max-width:1040px;margin:24px auto;padding:0 20px}.panel{padding:22px;border:1px solid var(--line);border-radius:8px;background:#fff}.section-title{margin:0 0 14px;font-size:17px;letter-spacing:0}.settings{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}.settings summary{font-weight:700;cursor:pointer}.settings-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:12px}
    input,select,textarea{width:100%;min-width:0;border:1px solid #b9c9d9;border-radius:5px;background:#fff;color:var(--ink);font:14px inherit}.settings input,.account-grid input,.picker input{height:42px;padding:0 12px}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}.field label,.batch label{display:block;margin-bottom:7px;font-weight:600}.picker{display:grid;gap:8px}.picker select{height:190px;padding:4px}.picker option{padding:7px}.batch{margin-top:18px}.batch textarea{min-height:96px;padding:10px;resize:vertical;line-height:1.5}
    .form{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}button.primary,button.secondary{height:42px;padding:0 18px;border-radius:5px;font:600 14px inherit;cursor:pointer}button.primary{border:0;background:var(--blue);color:#fff}button.primary:hover{background:#0958d9}button.secondary{border:1px solid #b9c9d9;background:#fff;color:#1756a9}button:disabled{opacity:.65;cursor:wait}.status{min-height:20px;margin:12px 0 0;color:var(--muted)}.status.error{color:var(--bad)}.status.ok{color:var(--good)}
    .result{margin-top:18px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.response-head{margin-top:18px}.result h2{margin:0;font-size:16px;letter-spacing:0}.copy{height:30px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;font:600 12px inherit;cursor:pointer}pre{max-height:540px;margin:10px 0 0;padding:16px;overflow:auto;border-radius:6px;background:#102a43;color:#e6f1ff;font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
    @media(max-width:680px){body{overflow-x:hidden}header{padding:16px}.header-row{align-items:flex-start;flex-direction:column;gap:14px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:8px}.nav a,.nav button{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 8px;text-align:center}h1{font-size:20px}.panel{padding:16px}.settings-grid,.account-grid{grid-template-columns:1fr}.form{display:grid;grid-template-columns:1fr}.form button{width:100%}main{margin:12px auto;padding:0 12px}pre{padding:12px;font-size:12px}}
    @media(max-width:360px){.nav{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div><div class="brand"><span class="mark">通</span><h1>通投账户取链</h1></div><p>按账户和站点生成京东通投深链。</p></div>
      <nav class="nav"><a href="/tools">工具中心</a><a href="/deeplink">普通取链</a><a href="/account">设置</a><button id="logout" type="button">退出登录</button></nav>
    </div>
  </header>
  <main>
    <section class="panel">
      <details class="settings">
        <summary>接口凭据设置 <span id="configStatus"></span></summary>
        <div class="settings-grid">
          <input id="token" type="password" placeholder="粘贴最新 Bearer token" autocomplete="off" />
          <input id="sign" type="password" placeholder="粘贴最新 X-Request-Sign" autocomplete="off" />
          <button id="saveConfig" class="secondary" type="button">保存配置</button>
        </div>
      </details>
      <h2 class="section-title">账户参数</h2>
      <div class="account-grid">
        <div class="field"><label for="accountId">accountid</label><input id="accountId" inputmode="numeric" maxlength="32" placeholder="输入媒体账户 ID" autocomplete="off" /></div>
        <div class="field"><label for="siteId">siteid</label><input id="siteId" inputmode="numeric" maxlength="32" placeholder="输入站点 ID" autocomplete="off" /></div>
      </div>
      <h2 class="section-title">选择商品</h2>
      <div class="picker">
        <input id="query" type="search" placeholder="搜索 SKU 或商品名称" autocomplete="off" />
        <select id="products" size="8" aria-label="SKU 搜索结果"></select>
      </div>
      <div class="batch"><label for="batchSkus">批量 SKU</label><textarea id="batchSkus" placeholder="每行一个 SKU，也支持逗号或空格分隔"></textarea></div>
      <form id="form" class="form">
        <button id="addBatch" class="secondary" type="button">加入批量列表</button>
        <button id="submit" class="primary" type="submit">生成通投深链</button>
        <button id="batchSubmit" class="primary" type="button">批量生成并下载模板</button>
      </form>
      <div id="status" class="status"></div>
      <div id="result" class="result" hidden>
        <div class="result-head"><h2>请求体</h2><button id="copyRequest" class="copy" type="button">复制请求体</button></div><pre id="requestOutput"></pre>
        <div class="result-head response-head"><h2>接口响应</h2><button id="copy" class="copy" type="button">复制响应</button></div><pre id="output"></pre>
      </div>
    </section>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    let output='',requestOutput='',searchTimer;
    async function api(url,options={}){const response=await fetch(url,options);const payload=await response.json().catch(()=>({error:`请求失败（HTTP ${response.status}）`}));if(!response.ok)throw Error(payload.error||`请求失败（HTTP ${response.status}）`);return payload}
    function setStatus(message,type=''){$('#status').textContent=message;$('#status').className=`status ${type}`}
    function accountParams(){const accountId=$('#accountId').value.trim(),siteId=$('#siteId').value.trim();if(!/^\d{1,32}$/.test(accountId))throw Error('请输入有效的 accountid');if(!/^\d{1,32}$/.test(siteId))throw Error('请输入有效的 siteid');localStorage.setItem('jdTongtouAccountId',accountId);localStorage.setItem('jdTongtouSiteId',siteId);return{accountId,siteId}}
    async function loadConfig(){try{const config=await api('/api/jd-account-deeplink/config');$('#configStatus').textContent=config.tokenConfigured&&config.signConfigured?'（已配置）':'（未配置）'}catch{$('#configStatus').textContent='（读取失败）'}}
    function renderProducts(products){const select=$('#products'),selected=select.value;select.innerHTML=products.map(product=>`<option value="${esc(product.skuId)}">${esc(product.skuId)} · ${esc(product.name||'未命名商品')}</option>`).join('');if(products.some(product=>product.skuId===selected))select.value=selected;else if(products.length)select.selectedIndex=0;setStatus(products.length?`找到 ${products.length} 个匹配商品`:'未找到匹配 SKU')}
    async function search(){try{renderProducts(await api(`/api/jd-account-deeplink/products?query=${encodeURIComponent($('#query').value.trim())}`))}catch(error){setStatus(error.message,'error')}}
    function batchSkuIds(){return[...new Set($('#batchSkus').value.split(/[\s,，；;]+/).map(value=>value.trim()).filter(Boolean))]}
    $('#query').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,180)};
    $('#saveConfig').onclick=async()=>{const button=$('#saveConfig'),token=$('#token').value.trim(),sign=$('#sign').value.trim();try{if(!token||!sign)throw Error('请同时粘贴 token 和 X-Request-Sign');button.disabled=true;await api('/api/jd-account-deeplink/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,sign})});$('#token').value='';$('#sign').value='';await loadConfig();setStatus('接口凭据已保存并立即生效','ok')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false}};
    $('#addBatch').onclick=()=>{const skuId=$('#products').value;if(!skuId)return setStatus('请先选择一个 SKU','error');const ids=batchSkuIds();if(!ids.includes(skuId))ids.push(skuId);$('#batchSkus').value=ids.join('\n');setStatus(`已加入 SKU ${skuId}，当前共 ${ids.length} 个`,'ok')};
    $('#form').onsubmit=async event=>{event.preventDefault();const button=$('#submit'),skuId=$('#products').value;try{if(!skuId)throw Error('请先选择一个 SKU');const params=accountParams();button.disabled=true;setStatus('正在生成通投深链...');const payload=await api('/api/jd-account-deeplink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skuId,...params})});requestOutput=JSON.stringify(payload.requestBody,null,2);output=JSON.stringify(payload.response,null,2);$('#requestOutput').textContent=requestOutput;$('#output').textContent=output;$('#result').hidden=false;setStatus(`已使用 SKU ${payload.product.skuId} 获取接口结果`,'ok')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false}};
    $('#batchSubmit').onclick=async()=>{const skuIds=batchSkuIds(),button=$('#batchSubmit');try{if(!skuIds.length)throw Error('请先添加批量 SKU');const params=accountParams();button.disabled=true;setStatus(`正在批量生成 ${skuIds.length} 个 SKU...`);const response=await fetch('/api/jd-account-deeplink/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skuIds,...params})});if(!response.ok){const error=await response.json().catch(()=>({error:`请求失败（HTTP ${response.status}）`}));throw Error(error.error||`请求失败（HTTP ${response.status}）`)}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='通投账户直达链接.xlsx';link.click();URL.revokeObjectURL(url);const failed=response.headers.get('X-Batch-Failed')||'0';setStatus(`已下载模板：成功 ${response.headers.get('X-Batch-Success')||0} 个，失败 ${failed} 个`,failed==='0'?'ok':'')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false}};
    $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(output);setStatus('响应已复制','ok')}catch{setStatus('复制失败，请手动复制','error')}};
    $('#copyRequest').onclick=async()=>{try{await navigator.clipboard.writeText(requestOutput);setStatus('请求体已复制','ok')}catch{setStatus('复制失败，请手动复制','error')}};
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    $('#accountId').value=localStorage.getItem('jdTongtouAccountId')||'';
    $('#siteId').value=localStorage.getItem('jdTongtouSiteId')||'';
    search();loadConfig();
  </script>
</body>
</html>
