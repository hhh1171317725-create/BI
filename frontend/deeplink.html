<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>京东深链生成</title>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--bad:#b42318;--good:#067647}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:var(--blue);color:#fff;font-weight:700}h1{margin:0;font-size:22px}header p{margin:7px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button{line-height:normal}.nav a:hover,.nav button:hover{border-color:var(--blue);background:#eaf3ff}main{max-width:980px;margin:24px auto;padding:0 20px}.panel{padding:22px;border:1px solid var(--line);border-radius:8px;background:#fff}.panel h2{margin:0;font-size:17px}.hint{margin:8px 0 20px;color:var(--muted);line-height:1.6}.settings{margin:0 0 20px;padding:12px 0;border-bottom:1px solid var(--line)}.settings summary{font-weight:700;cursor:pointer}.settings-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:12px}.settings input,.picker input,select,textarea{width:100%;min-width:0;border:1px solid #b9c9d9;border-radius:5px;background:#fff;font:14px inherit}.settings input,.picker input{height:42px;padding:0 12px}.picker{display:grid;gap:8px}.picker select{height:190px;padding:4px}.picker option{padding:7px}.batch{margin-top:18px}.batch label{display:block;margin-bottom:7px;font-weight:600}.batch textarea{min-height:96px;padding:10px;resize:vertical;line-height:1.5}.form{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}button.primary{height:42px;padding:0 18px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}button.primary:hover{background:#0958d9}button.secondary{height:42px;padding:0 16px;border:1px solid #b9c9d9;border-radius:5px;background:#fff;color:#1756a9;font:600 14px inherit;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.status{min-height:20px;margin:12px 0 0;color:var(--muted)}.status.error{color:var(--bad)}.status.ok{color:var(--good)}.result{margin-top:18px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.response-head{margin-top:18px}.result h2{margin:0;font-size:16px}.copy{height:30px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;font:600 12px inherit;cursor:pointer}pre{max-height:540px;margin:10px 0 0;padding:16px;overflow:auto;border-radius:6px;background:#102a43;color:#e6f1ff;font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}@media(max-width:620px){header{padding:16px}.header-row{align-items:flex-start;flex-direction:column}.settings-grid{grid-template-columns:1fr}.form button{width:100%}main{margin:16px auto;padding:0 12px}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">链</span><h1>京东深链生成</h1></div><p>填写 lp_url，使用服务器已配置的默认渠道参数生成深链。</p></div><nav class="nav"><a href="/tools">工具中心</a><a href="/">大航海日报</a><a href="/jd">京东日报</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main><section class="panel"><h2>选择商品</h2><p class="hint">输入 SKU 或商品名搜索，从底表中选择商品后生成深链。页面不会再要求填写 URL。</p><details class="settings"><summary>接口凭据设置 <span id="configStatus"></span></summary><div class="settings-grid"><input id="token" type="password" placeholder="粘贴最新 Bearer token" autocomplete="off" /><input id="sign" type="password" placeholder="粘贴最新 X-Request-Sign" autocomplete="off" /><button id="saveConfig" class="secondary" type="button">保存配置</button></div></details><div class="picker"><input id="query" type="search" placeholder="搜索 SKU 或商品名称" autocomplete="off" /><select id="products" size="8" aria-label="SKU 搜索结果"></select></div><div class="batch"><label for="batchSkus">批量 SKU</label><textarea id="batchSkus" placeholder="每行一个 SKU；也支持用逗号、空格分隔。"></textarea></div><form id="form" class="form"><button id="addBatch" class="secondary" type="button">加入批量列表</button><button id="submit" class="primary" type="submit">生成深链</button><button id="batchSubmit" class="primary" type="button">批量生成并下载模板</button></form><div id="status" class="status"></div><div id="result" class="result" hidden><div class="result-head"><h2>请求体</h2><button id="copyRequest" class="copy" type="button">复制请求体</button></div><pre id="requestOutput"></pre><div class="result-head response-head"><h2>接口响应</h2><button id="copy" class="copy" type="button">复制响应</button></div><pre id="output"></pre></div></section></main>
  <script>
    const $=selector=>document.querySelector(selector),esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');let output='',requestOutput='',searchTimer;
    async function request(url,options={}){const response=await fetch(url,options);const payload=await response.json().catch(()=>({error:`请求失败（HTTP ${response.status}）`}));if(!response.ok)throw Error(payload.error||`请求失败（HTTP ${response.status}）`);return payload}
    function status(message,type=''){$('#status').textContent=message;$('#status').className=`status ${type}`}
    async function loadConfig(){try{const config=await request('/api/jd-deeplink/config');$('#configStatus').textContent=config.tokenConfigured&&config.signConfigured?'（已配置）':'（未配置）'}catch{$('#configStatus').textContent='（读取失败）'}}
    function renderProducts(products){const select=$('#products'),selected=select.value;select.innerHTML=products.map(product=>`<option value="${esc(product.skuId)}">${esc(product.skuId)} · ${esc(product.name||'未命名商品')}</option>`).join('');if(products.some(product=>product.skuId===selected))select.value=selected;else if(products.length)select.selectedIndex=0;status(products.length?`找到 ${products.length} 个匹配商品，请确认选择。`:'未找到匹配 SKU','')}
    async function search(){try{const products=await request(`/api/jd-deeplink/products?query=${encodeURIComponent($('#query').value.trim())}`);renderProducts(products)}catch(error){status(error.message,'error')}}
    $('#query').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,180)};
    $('#saveConfig').onclick=async()=>{const button=$('#saveConfig'),token=$('#token').value.trim(),sign=$('#sign').value.trim();try{if(!token||!sign)throw Error('请同时粘贴 token 和 X-Request-Sign');button.disabled=true;await request('/api/jd-deeplink/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,sign})});$('#token').value='';$('#sign').value='';await loadConfig();status('接口凭据已保存并立即生效','ok')}catch(error){status(error.message,'error')}finally{button.disabled=false}};
    $('#addBatch').onclick=()=>{const skuId=$('#products').value;if(!skuId)return status('请先选择一个 SKU','error');const ids=batchSkuIds();if(!ids.includes(skuId))ids.push(skuId);$('#batchSkus').value=ids.join('\n');status(`已加入 SKU ${skuId}，当前共 ${ids.length} 个。`,'ok')};
    function batchSkuIds(){return [...new Set($('#batchSkus').value.split(/[\s,，;；]+/).map(value=>value.trim()).filter(Boolean))]}
    $('#form').onsubmit=async event=>{event.preventDefault();const button=$('#submit'),skuId=$('#products').value;try{if(!skuId)throw Error('请先选择一个 SKU');button.disabled=true;status('正在生成深链…');const payload=await request('/api/jd-deeplink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skuId})});requestOutput=JSON.stringify(payload.requestBody,null,2);output=JSON.stringify(payload.response,null,2);$('#requestOutput').textContent=requestOutput;$('#output').textContent=output;$('#result').hidden=false;status(`已使用 SKU ${payload.product.skuId} 获取接口结果`,'ok')}catch(error){status(error.message,'error')}finally{button.disabled=false}};
    $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(output);status('结果已复制','ok')}catch{status('复制失败，请手动复制结果','error')}};
    $('#copyRequest').onclick=async()=>{try{await navigator.clipboard.writeText(requestOutput);status('请求体已复制','ok')}catch{status('复制失败，请手动复制请求体','error')}};
    $('#batchSubmit').onclick=async()=>{const skuIds=batchSkuIds(),button=$('#batchSubmit');try{if(!skuIds.length)throw Error('请先添加批量 SKU');button.disabled=true;status(`正在批量生成 ${skuIds.length} 个 SKU…`);const response=await fetch('/api/jd-deeplink/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skuIds})});if(!response.ok){const error=await response.json().catch(()=>({error:`请求失败（HTTP ${response.status}）`}));throw Error(error.error||`请求失败（HTTP ${response.status}）`)}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='直达链接导入.xlsx';link.click();URL.revokeObjectURL(url);status(`已下载模板：成功 ${response.headers.get('X-Batch-Success')||0} 个，失败 ${response.headers.get('X-Batch-Failed')||0} 个。`,response.headers.get('X-Batch-Failed')==='0'?'ok':'')}catch(error){status(error.message,'error')}finally{button.disabled=false}};
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    search();loadConfig();
  </script>
</body>
</html>
