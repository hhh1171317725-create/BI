  <script>fetch('/api/session',{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject()).then(result=>{if(!result.authenticated)throw Error();window.currentSessionUser=result.user||{};if(result.user?.role==='admin')document.documentElement.classList.add('admin');try{localStorage.removeItem('marketing-report-x-token')}catch{}document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>

  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--good:#12805c;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.header-actions{display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:inline-grid;width:30px;height:30px;padding:0;place-items:center;border:0;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer;font-size:17px;font-weight:700}.brand-mark:hover,.brand-mark:focus-visible{background:#0958d9;outline:3px solid rgba(22,119,255,.16)}.report-link{flex:none;padding:8px 12px;border:1px solid #c7d3df;border-radius:5px;color:#1756a9;text-decoration:none;font-weight:600;background:#fff;cursor:pointer;font:600 14px inherit}.report-link:hover,.report-link:focus-visible{border-color:var(--blue);background:#eaf3ff;outline:none}h1{margin:0;font-size:22px}header p,.note{color:var(--muted)}header p{margin:7px 0 0}.panel,.content{margin:18px 32px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.controls,.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:7px;color:#475467;font-weight:600}input,select{height:36px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;font:inherit}input{width:390px}input[type=date]{width:155px}#accountId{width:220px}select{min-width:260px}button{height:36px;padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}button.secondary{color:#1756a9;background:#eaf3ff}button:disabled{opacity:.5;cursor:not-allowed}.note{margin:10px 0 0;font-size:12px}.chart-heading{margin:20px 16px 0;font-size:14px;font-weight:600;line-height:20px;color:var(--ink)}.hidden{display:none}.cards{margin:18px 32px;display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px}.card{min-height:88px;padding:14px;border:1px solid var(--line);border-radius:7px;background:#fff}.card .k{color:var(--muted);font-size:12px}.card .v{margin-top:10px;font-size:20px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}.tabs{margin:18px 32px 0;display:flex;gap:4px;border-bottom:1px solid var(--line)}.tab{border-radius:5px 5px 0 0;background:transparent;color:var(--muted)}.tab.active{background:#eaf3ff;color:var(--blue)}.content{margin-top:0;border-top:0;border-radius:0 0 8px 8px;padding:0;overflow:hidden}.insight{padding:16px 18px 5px;color:#475467}.chart{width:100%;height:270px}.table-wrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid #edf1f5;text-align:right}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f2f6fa;color:#344054;font-size:12px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 14px;color:var(--muted)}.pager button{height:30px;padding:0 11px;font-size:12px}@media(max-width:950px){header,.panel,.cards,.tabs,.content{margin-left:16px;margin-right:16px}.header-row{align-items:flex-start}.cards{grid-template-columns:repeat(2,1fr)}input,select{width:100%}}
  </style>
  <style>
    .alert-panel{margin:18px 32px;padding:16px 18px;border:1px solid #f5c2c0;border-radius:8px;background:#fff4f3}
    .alert-panel.ok{border-color:#a9dec9;background:#f0fbf7}.alert-panel.no-data{border-color:#d9e2ec;background:#fff}
    .alert-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.alert-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.alert-title{margin:0;font-size:16px}.alert-badge{flex:none;padding:3px 9px;border-radius:999px;background:#cf3d3d;color:#fff;font-size:12px;font-weight:700}.alert-panel.ok .alert-badge{background:#12805c}.alert-panel.no-data .alert-badge{background:#667085}.alert-filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:12px}.alert-filters label{gap:4px;font-size:12px}.alert-filters select{height:32px;min-width:220px;background:#fff}.alert-toggle{height:28px;padding:0 10px;border:1px solid #c7d3df;background:#fff;color:#1756a9;font-size:12px}

  <style>

    .optimizer-breakdown{margin:16px 0 4px;border:1px solid #dbe6f1;border-radius:7px;overflow:hidden;background:#fff}.optimizer-breakdown .chart-heading{margin:14px 18px 0}.optimizer-breakdown .chart-subtitle{margin-bottom:12px}
    @media(max-width:560px){.chart{height:280px}.table-tools{align-items:flex-start;flex-wrap:wrap}.column-picker{grid-template-columns:1fr;width:calc(100vw - 48px)}}
  </style>
  <style>
    .panel,.content,.card,.alert-panel{box-shadow:0 2px 10px rgba(23,43,77,.035)}

      body{overflow-x:hidden}

      input,input[type=date],#accountId,select{width:100%;min-width:0}
      .controls>button,.filters>button{width:100%}
      .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .card{min-height:78px;padding:12px}

      .table-wrap .drill-link{padding:0;text-align:left;font-size:15px}
      .table-tools{gap:8px;padding:8px 10px}
      .pager{justify-content:space-between;flex-wrap:wrap;padding:10px}

    @media(max-width:380px){
      .header-actions{grid-template-columns:1fr}

<body>
  <header><div class="header-row"><div><div class="brand"><button class="brand-mark admin-only" id="copyToken" type="button" title="复制已保存的 x-token" aria-label="复制已保存的 x-token">海</button><h1>大航海日报分析</h1></div><p>全量导出后，按优化师、项目、日期和任务归因汇总。利润口径：预估佣金 - 现金消耗。</p></div><div class="header-actions"><a class="report-link" href="/tools">工具中心</a><a class="report-link" href="/account">账户设置</a><a class="report-link" href="/jd">京东日报 →</a><button class="report-link" id="logout" type="button">退出登录</button></div></div></header>
  <section class="panel admin-only"><div class="controls"><label>x-token<input id="token" type="password" autocomplete="off" placeholder="仅更新最新数据时需要粘贴" /></label><label>用户 ID<input id="userId" value="20" inputmode="numeric" /></label><button id="load">更新全量数据</button></div><p class="note" id="status">正在查询 MySQL 数据库。成功更新后，Token 会安全保存在服务器运行目录，用于每天 09:00 自动更新。</p></section>
  <section class="panel hidden" id="filterPanel"><div class="filters"><label>开始日期（可选）<input id="start" type="date" /></label><label>结束日期（可选）<input id="end" type="date" /></label><label>账户 ID（可选）<input id="accountId" type="search" inputmode="numeric" placeholder="输入完整账户 ID" /></label><button class="secondary" id="apply">应用筛选</button><span class="note" id="loading"></span></div></section>
  <section class="alert-panel hidden" id="alerts" aria-live="polite"></section>
  <section class="cards hidden" id="cards"></section>
  <nav class="tabs hidden" id="tabs"><button class="tab active" data-key="by_optimizer">优化师</button><button class="tab" data-key="by_project">项目</button><button class="tab" data-key="by_date">时间</button><button class="tab" data-key="by_task">任务</button></nav>
  <main class="content hidden" id="content"><div class="insight" id="insight"></div><section class="hidden" id="mainChartSection" aria-labelledby="chartTitle"><h2 class="chart-heading" id="chartTitle"></h2><p class="chart-subtitle">横向拖动底部滑块可查看较长日期范围。</p><div class="chart" id="chart" role="img" aria-label="大航海日报日期趋势图"></div></section><div class="table-tools" id="mainTableTools"></div><div class="table-wrap"><table id="table"></table></div><div class="pager" id="pager"></div></main>
  <section class="panel hidden" id="drillPanel"><div class="filters"><label id="drillLabel">关联对象<select id="drillSelect"></select></label><label class="hidden" id="optimizerFilter">优化师<select id="optimizerSelect"></select></label><label class="hidden" id="projectFilter">项目<select id="projectSelect"></select></label><label class="hidden" id="taskFilter">任务<select id="taskSelect"></select></label></div><p class="note" id="drillNote"></p><section class="optimizer-breakdown hidden" id="optimizerBreakdown"><h2 class="chart-heading" id="optimizerBreakdownTitle"></h2><p class="chart-subtitle">按当前日期范围汇总各优化师的消耗与利润。</p><div class="table-tools" id="optimizerBreakdownTools"></div><div class="table-wrap"><table id="optimizerBreakdownTable"></table></div></section><h2 class="chart-heading" id="drillChartTitle"></h2><p class="chart-subtitle">折线同时展示每日消耗与现金 ROI，便于定位投放效率变化。</p><div class="chart" id="drillChart" role="img" aria-label="每日消耗与现金 ROI 趋势图"></div><div class="table-tools" id="drillTableTools"></div><div class="table-wrap"><table id="drillTable"></table></div><div class="pager" id="drillPager"></div></section>
  <script src="/echarts.min.js"></script>
  <script>
    let data=null,active='by_optimizer',page=1,drillPage=1,mainChart,detailChart,alertOptimizer='__all__',alertProject='__all__',alertTask='__all__',alertsExpanded=false;
    const pageSize=20;
    const names={by_optimizer:'优化师',by_project:'项目',by_date:'日期',by_task:'任务名'};
    const $=selector=>document.querySelector(selector);
    const numberFormatter=new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}),percentFormatter=new Intl.NumberFormat('zh-CN',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2});
    const fmt=n=>numberFormatter.format(n||0);
    const pct=n=>percentFormatter.format(n||0);
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    // 动态下拉框使用 DOM Option，避免上游维度文本进入 innerHTML。
    function setSelectOptions(select,entries){const fragment=document.createDocumentFragment();for(const [value,label] of entries){const option=document.createElement('option');option.value=String(value??'');option.textContent=String(label??value??'');fragment.appendChild(option)}select.replaceChildren(fragment)}
    const dismissedAlertStorageKey='dhh-dismissed-alerts-v1';
    const isAdmin=()=>window.currentSessionUser?.role==='admin';
    const tableSettingsStorageKey='dhh-table-settings-v1';
    let tableSettings=(()=>{try{const parsed=JSON.parse(localStorage.getItem(tableSettingsStorageKey)||'{}');return parsed&&typeof parsed==='object'?parsed:{}}catch{return{}}})();
    function beijingDateOffset(days){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(part=>part.type!=='literal').map(part=>[part.type,Number(part.value)]));return new Date(Date.UTC(parts.year,parts.month-1,parts.day+days)).toISOString().slice(0,10)}
    const defaultEndDate=beijingDateOffset(-1),defaultMonthStart=`${defaultEndDate.slice(0,8)}01`;
    $('#start').value=defaultMonthStart;
    $('#end').value=defaultEndDate;
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    const alertId=(alerts,item)=>encodeURIComponent(JSON.stringify([alerts.date,item.优化师,item.项目,item.账户ID||item.账户名称,item.任务名]));
    function dismissedAlertIds(){try{const ids=JSON.parse(localStorage.getItem(dismissedAlertStorageKey)||'[]');return new Set(Array.isArray(ids)?ids:[])}catch{return new Set()}}
    function saveDismissedAlertIds(ids){localStorage.setItem(dismissedAlertStorageKey,JSON.stringify([...ids]))}
    async function copyToken(){if(!isAdmin())return;try{const credentials=await get('/api/report-credentials'),token=String(credentials.token||'').trim();if(credentials.userId)$('#userId').value=credentials.userId;if(!token)throw Error('服务器尚未保存 x-token，请先成功更新一次全量数据。');if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(token);else{const field=document.createElement('textarea');field.value=token;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();document.execCommand('copy');field.remove()}$('#status').textContent='服务器保存的 x-token 已复制到剪贴板。'}catch(error){$('#status').textContent=error.message||'浏览器未允许自动复制，请检查剪贴板权限。'}}
    async function post(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(response.status===401){location.replace('/login');throw Error('登录已失效')}const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用，请确认已拉取最新代码并重启服务')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    async function get(url){const response=await fetch(url,{cache:'no-store'});if(response.status===401){location.replace('/login');throw Error('登录已失效')}const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用，请确认已拉取最新代码并重启服务')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    function cell(value,column,key){return column==='ROI'||column==='现金ROI'?pct(value):column===key||column==='日期'||['优化师','项目','任务名'].includes(column)?esc(value):fmt(value)}
    function saveTableSettings(){try{localStorage.setItem(tableSettingsStorageKey,JSON.stringify(tableSettings))}catch{}}
    function tableSetting(scope){tableSettings[scope]??={};return tableSettings[scope]}
    function sortRows(rows,scope){const setting=tableSetting(scope);if(!setting.sortColumn)return[...rows];const direction=setting.sortDirection==='desc'?-1:1;return[...rows].sort((left,right)=>{const leftValue=left[setting.sortColumn],rightValue=right[setting.sortColumn],leftNumber=Number(leftValue),rightNumber=Number(rightValue);if(Number.isFinite(leftNumber)&&Number.isFinite(rightNumber))return(leftNumber-rightNumber)*direction;return String(leftValue??'').localeCompare(String(rightValue??''),'zh-CN',{numeric:true,sensitivity:'base'})*direction})}
    const mobileTableQuery=window.matchMedia('(max-width:700px)');
    const mobilePreferredColumns=new Set(['消耗','现金消耗','现金利润','现金ROI','结算数','结算单价','转化成本','注册成本']);
    function selectedTableColumns(setting,allColumns,fixedColumns){if(Array.isArray(setting.columns))return setting.columns;return mobileTableQuery.matches?allColumns.filter(column=>fixedColumns.includes(column)||mobilePreferredColumns.has(column)):allColumns}
    function renderTableTools(target,scope,allColumns,fixedColumns){const setting=tableSetting(scope),selectedColumns=selectedTableColumns(setting,allColumns,fixedColumns),wasOpen=target.querySelector('details')?.open,selectedCount=allColumns.filter(column=>fixedColumns.includes(column)||selectedColumns.includes(column)).length;target.dataset.tableScope=scope;target.innerHTML=`<details class="column-menu" ${wasOpen?'open':''}><summary>选择列（${selectedCount}/${allColumns.length}）</summary><div class="column-picker">${allColumns.map(column=>{const fixed=fixedColumns.includes(column),checked=fixed||selectedColumns.includes(column);return`<label><input type="checkbox" data-table-column="${esc(column)}" ${checked?'checked':''} ${fixed?'disabled':''}>${esc(column)}</label>`}).join('')}</div></details><button class="column-reset" type="button" data-reset-columns>恢复默认列</button><span>点击表头可切换升序/降序</span>`}
