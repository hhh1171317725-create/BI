<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject()).then(result=>{if(!result.authenticated)throw Error();document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <title>京东商品主图下载</title>
  <script src="/report-visibility.js"></script>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--good:#138a5b;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:#263449;color:#fff;font-weight:700}h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:7px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.secondary{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button,.secondary{line-height:normal}.nav a:hover,.nav button:hover,.secondary:hover{border-color:var(--blue);background:#eaf3ff}main{width:min(1040px,calc(100% - 64px));margin:22px auto}.panel{padding:22px;border:1px solid var(--line);border-radius:7px;background:#fff}.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px}.field{display:grid;gap:8px}.field-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.field-head label{font-weight:700;color:#344054}.counter{color:var(--muted);font-size:12px}textarea{width:100%;min-height:290px;resize:vertical;padding:12px;border:1px solid #c7d3df;border-radius:5px;color:var(--ink);background:#fff;font:14px/1.7 Consolas,"Microsoft YaHei",sans-serif;letter-spacing:0}textarea:focus{outline:2px solid rgba(22,119,255,.16);border-color:var(--blue)}.summary{display:flex;flex-direction:column;min-height:290px;padding-left:24px;border-left:1px solid var(--line)}.summary h2{margin:0 0 14px;font-size:16px}.metric{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1f5}.metric span{color:var(--muted)}.metric strong{font-size:16px}.actions{display:grid;gap:10px;margin-top:auto}.primary,.secondary{width:100%;height:38px}.primary{padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}.primary:hover{background:#0958d9}.primary:disabled,.secondary:disabled{opacity:.55;cursor:not-allowed}.status{min-height:22px;margin:14px 0 0;color:var(--muted);line-height:1.55}.status.good{color:var(--good)}.status.bad{color:var(--bad)}@media(max-width:760px){header{padding:16px}.header-row{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.nav a,.nav button{display:flex;align-items:center;justify-content:center;padding:0 8px}main{width:auto;margin:12px}.panel{padding:16px}.form-grid{grid-template-columns:1fr;gap:18px}textarea{min-height:230px}.summary{min-height:0;padding:0;border:0;border-top:1px solid var(--line);padding-top:18px}.actions{grid-template-columns:1fr 1fr;margin-top:18px}}@media(max-width:390px){.nav,.actions{grid-template-columns:1fr}h1{font-size:19px}.field-head{align-items:flex-start;flex-direction:column;gap:4px}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">图</span><h1>京东商品主图下载</h1></div><p>批量获取商品轮播主图。</p></div><nav class="nav"><a href="/tools">工具中心</a><a href="/">大航海日报</a><a href="/jd">京东广义新</a><a href="/account">设置</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main><section class="panel"><div class="form-grid"><div class="field"><div class="field-head"><label for="skus">SKU 列表</label><span class="counter" id="counter">0 / 20</span></div><textarea id="skus" inputmode="numeric" spellcheck="false" placeholder="10105896126923&#10;100012043978"></textarea></div><aside class="summary"><h2>下载任务</h2><div class="metric"><span>有效 SKU</span><strong id="validCount">0</strong></div><div class="metric"><span>重复项</span><strong id="duplicateCount">0</strong></div><div class="metric"><span>文件格式</span><strong>ZIP</strong></div><div class="actions"><button class="secondary" id="openFirst" type="button">打开首个商品</button><button class="primary" id="download" type="button">批量下载</button></div></aside></div><p class="status" id="status">等待输入 SKU。</p></section></main>
  <script>
    const $=selector=>document.querySelector(selector);
    function parsed(){const all=($('#skus').value.match(/\d{5,20}/g)||[]),unique=[...new Set(all)];return{all,unique}}
    function update(){const {all,unique}=parsed();$('#counter').textContent=`${unique.length} / 20`;$('#validCount').textContent=unique.length;$('#duplicateCount').textContent=all.length-unique.length;$('#counter').style.color=unique.length>20?'var(--bad)':'';$('#download').disabled=!unique.length||unique.length>20;$('#openFirst').disabled=!unique.length}
    function setStatus(message,type=''){const node=$('#status');node.textContent=message;node.className=`status ${type}`}
    async function errorMessage(response){try{const payload=await response.json();return payload.error||`请求失败（${response.status}）`}catch{return`请求失败（${response.status}）`}}
    $('#skus').addEventListener('input',update);
    $('#openFirst').onclick=()=>{const sku=parsed().unique[0];if(sku)window.open(`https://item.jd.com/${sku}.html`,'_blank','noopener')};
    $('#download').onclick=async()=>{const skus=parsed().unique;if(!skus.length)return;if(skus.length>20){setStatus('单次最多下载 20 个 SKU。','bad');return}const button=$('#download');button.disabled=true;button.textContent='正在获取主图...';setStatus(`正在处理 ${skus.length} 个 SKU，请保持页面打开。`);try{const response=await fetch('/api/jd-images/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skus})});if(!response.ok)throw Error(await errorMessage(response));const blob=await response.blob(),url=URL.createObjectURL(blob),anchor=document.createElement('a'),disposition=response.headers.get('Content-Disposition')||'',match=disposition.match(/filename\*?=(?:UTF-8'')?([^;]+)/i);anchor.href=url;anchor.download=match?decodeURIComponent(match[1].replaceAll('"','')):`jd-images-${Date.now()}.zip`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);const success=response.headers.get('X-Download-Success')||skus.length,failed=response.headers.get('X-Download-Failed')||0,images=response.headers.get('X-Download-Images')||0;setStatus(`已下载 ${images} 张主图，成功 ${success} 个 SKU，失败 ${failed} 个。`,'good')}catch(error){setStatus(error.message,'bad')}finally{button.textContent='批量下载';update()}};
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    update();
  </script>
</body>
</html>
