<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}html:not(.admin) .admin-only{display:none!important}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject()).then(result=>{if(!result.authenticated)throw Error();window.currentSessionUser=result.user||{};if(result.user?.role==='admin')document.documentElement.classList.add('admin');try{localStorage.removeItem('marketing-report-x-token')}catch{}document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <title>京东 CPA 日报分析</title>
  <link rel="icon" type="image/png" href="/assets/miku-pet.png" />
  <link rel="stylesheet" href="/pet.css?v=20260730-ai-server" />
  <style>
    :root {
      --accent: #e1251b;
      --accent-dark: #b51d15;
      --accent-soft: #fff1f0;
      --ink: #172b4d;
      --muted: #667085;
      --line: #d9e2ec;
      --bg: #f5f8fb;
      --good: #12805c;
      --bad: #cf3d3d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    header {
      padding: 20px 32px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      display: inline-grid;
      width: 30px;
      height: 30px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
    }

    .brand-mark:hover,
    .brand-mark:focus-visible {
      background: var(--accent-dark);
      outline: 3px solid rgba(225, 37, 27, .16);
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    header p,
    .note {
      color: var(--muted);
    }

    header p {
      margin: 7px 0 0;
    }

    .report-link {
      flex: none;
      padding: 8px 12px;
      border: 1px solid #c7d3df;
      border-radius: 5px;
      color: #344054;
      text-decoration: none;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .report-link:hover,
    .report-link:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    .panel,
    .content {
      margin: 18px 32px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .controls,
    .filters {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #475467;
      font-weight: 600;
    }

    input,
    select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid #c7d3df;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(225, 37, 27, .1);
      outline: none;
    }

    input { width: 390px; }
    input[type="date"] { width: 155px; }
    #accountId { width: 220px; }
    select { min-width: 260px; }

    button {
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 5px;
      background: var(--accent);
      color: #fff;
      font: 600 14px inherit;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { background: var(--accent-dark); }

    button.secondary {
      border: 1px solid #ffc9c6;
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    button.secondary:hover:not(:disabled) { background: #ffe4e2; }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .note {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .status.error { color: var(--bad); }
    .status.success { color: var(--good); }
    .hidden { display: none !important; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin: 18px 32px;
    }

    .card {
      min-height: 88px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(23, 43, 77, .035);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 18px rgba(23, 43, 77, .08);
    }

    .card .k {
      color: var(--muted);
      font-size: 12px;
    }

    .card .v {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 700;
    }

    .good { color: var(--good); }
    .bad { color: var(--bad); }

    .tabs {
      display: flex;
      gap: 4px;
      margin: 18px 32px 0;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      flex: none;
      border-radius: 5px 5px 0 0;
      background: transparent;
      color: var(--muted);
    }

    .tab:hover:not(:disabled) {
      background: #f9e9e8;
      color: var(--accent);
    }

    .tab.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .content {
      margin-top: 0;
      padding: 0;
      overflow: hidden;
      border-top: 0;
      border-radius: 0 0 8px 8px;
    }

    .insight {
      padding: 16px 18px 5px;
      color: #475467;
      line-height: 1.6;
    }

    .chart-heading {
      margin: 20px 18px 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .chart-subtitle {
      margin: 4px 18px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .chart {
      width: 100%;
      height: 310px;
    }

    .table-wrap {
      max-height: 590px;
      overflow: auto;
      border-top: 1px solid #edf1f5;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      white-space: nowrap;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf1f5;
      background: #fff;
      text-align: right;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f2f6fa;
      color: #344054;
      font-size: 12px;
    }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      text-align: left;
    }

    th:first-child {
      z-index: 3;
      background: #f2f6fa;
    }

    tr:hover td { background: #fafcff; }
    tr:hover td:first-child { background: #fafcff; }

    .drill-link {
      height: auto;
      padding: 2px 5px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #5d7fa7;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: color .15s ease, background-color .15s ease;
    }

    .drill-link:hover,
    .drill-link:focus-visible {
      color: #3f6693;
      background: #eef4fa;
      outline: none;
    }

    .table-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
      padding: 7px 14px;
      border-top: 1px solid #edf1f5;
      background: #fafcff;
      color: var(--muted);
      font-size: 12px;
    }

    .column-menu { position: relative; }
    .column-menu summary {
      padding: 5px 10px;
      border: 1px solid #cbd8e6;
      border-radius: 5px;
      background: #fff;
      color: #526d8c;
      cursor: pointer;
      font-weight: 600;
      list-style: none;
    }
    .column-menu summary::-webkit-details-marker { display: none; }
    .column-picker {
      position: absolute;
      z-index: 8;
      top: calc(100% + 5px);
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(145px, 1fr));
      gap: 7px 12px;
      width: min(620px, calc(100vw - 64px));
      max-height: 310px;
      padding: 12px;
      overflow: auto;
      border: 1px solid #cbd8e6;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(23, 43, 77, .15);
    }
    .column-picker label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #475467;
      font-size: 12px;
      font-weight: 400;
    }
    .column-picker input { width: auto; height: auto; }
    .column-reset {
      height: 27px;
      padding: 0 9px;
      border: 1px solid #cbd8e6;
      background: #fff;
      color: #526d8c;
      font-size: 12px;
    }
    .sort-button {
      height: auto;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 600;
      white-space: nowrap;
    }
    .sort-button:hover,
    .sort-button:focus-visible { color: #315f91; background: transparent; outline: none; }
    .sort-indicator { margin-left: 3px; color: #5d7fa7; }

    .empty-cell {
      height: 100px;
      color: var(--muted);
      text-align: center !important;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 14px;
      color: var(--muted);
    }

    .pager button {
      height: 30px;
      padding: 0 11px;
      font-size: 12px;
    }

    .drill-panel {
      padding: 0;
      overflow: hidden;
    }

    .drill-header {
      padding: 18px 18px 0;
    }

    .drill-panel .note { margin-bottom: 0; }

    @media (max-width: 950px) {
      header,
      .panel,
      .cards,
      .tabs,
      .content {
        margin-left: 16px;
        margin-right: 16px;
      }

      header { margin: 0; }
      .header-row { align-items: flex-start; }
      input, select { width: 100%; }
      .controls > label, .filters > label { flex: 1 1 100%; }
      .chart { height: 280px; }
    }

    @media (max-width: 560px) {
      .header-row { flex-direction: column; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card .v { font-size: 17px; }
      .table-tools { align-items: flex-start; flex-wrap: wrap; }
      .column-picker { grid-template-columns: 1fr; width: calc(100vw - 48px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <div class="brand"><button class="brand-mark admin-only" id="copyToken" type="button" title="复制已保存的 x-token" aria-label="复制已保存的 x-token">京</button><h1>京东 CPA 日报分析</h1></div>
        <p>按优化师、日期、媒体、媒体账户和推客归因汇总，联动查看优化师每日趋势与订单明细。</p>
      </div>
      <div class="header-actions">
        <a class="report-link" href="/tools">工具中心</a>
        <a class="report-link" href="/account">账户设置</a>
        <a class="report-link" href="/">返回大航海日报</a>
        <button class="report-link" id="logout" type="button">退出登录</button>
      </div>
    </div>
  </header>

  <section class="panel admin-only">
    <div class="controls">
      <label>x-token
        <input id="token" type="password" autocomplete="off" placeholder="仅更新最新数据时需要粘贴" />
      </label>
      <label>用户 ID
        <input id="userId" value="20" inputmode="numeric" />
      </label>
      <button id="load" type="button">更新京东全量数据</button>
    </div>
    <p class="note status" id="status" aria-live="polite">正在查询 MySQL 数据库。成功更新后，Token 会安全保存在服务器运行目录，用于每天 09:00 自动更新。</p>
  </section>

  <section class="panel hidden" id="filterPanel">
    <div class="filters">
      <label>开始日期（可选）
        <input id="start" type="date" />
      </label>
      <label>结束日期（可选）
        <input id="end" type="date" />
      </label>
      <label>账户 ID（可选）
        <input id="accountId" type="search" inputmode="numeric" placeholder="输入完整媒体账户 ID" />
      </label>
      <label>是否排除未知优化师
        <select id="excludeUnknownOptimizer">
          <option value="true">是，排除未知优化师</option>
          <option value="false">否，保留全部数据</option>
        </select>
      </label>
      <button class="secondary" id="apply" type="button">应用筛选</button>
      <button class="secondary" id="reset" type="button">重置日期</button>
      <span class="note" id="loading" aria-live="polite"></span>
    </div>
  </section>

  <section class="cards hidden" id="cards" aria-label="京东日报汇总"></section>

  <nav class="tabs hidden" id="tabs" aria-label="分析维度" role="tablist">
    <button class="tab active" type="button" data-key="by_optimizer" role="tab" aria-selected="true">优化师</button>
    <button class="tab" type="button" data-key="by_date" role="tab" aria-selected="false">日期</button>
    <button class="tab" type="button" data-key="by_media" role="tab" aria-selected="false">媒体</button>
    <button class="tab" type="button" data-key="by_account" role="tab" aria-selected="false">媒体账户</button>
    <button class="tab" type="button" data-key="by_promoter" role="tab" aria-selected="false">推客</button>
  </nav>

  <main class="content hidden" id="content">
    <div class="insight" id="insight"></div>
    <section class="hidden" id="mainChartSection" aria-labelledby="mainChartTitle">
      <h2 class="chart-heading" id="mainChartTitle"></h2>
      <p class="chart-subtitle">横向拖动底部滑块可查看较长日期范围。</p>
      <div class="chart" id="mainChart" role="img" aria-label="京东日报日期趋势图"></div>
    </section>
    <div class="table-tools" id="mainTableTools"></div>
    <div class="table-wrap"><table id="table"></table></div>
    <div class="pager" id="pager"></div>
  </main>

  <section class="panel drill-panel hidden" id="drillPanel">
    <div class="drill-header">
      <div class="filters">
        <label id="drillSelectLabel">优化师关联日期
          <select id="drillSelect" aria-label="选择下钻对象"></select>
        </label>
      </div>
      <p class="note" id="drillNote"></p>
    </div>
    <h2 class="chart-heading" id="drillChartTitle"></h2>
    <p class="chart-subtitle">折线同时展示每日消耗、预估 ROI 与实际 ROI，便于定位投放效率变化。</p>
    <div class="chart" id="drillChart" role="img" aria-label="优化师每日消耗、预估 ROI 与实际 ROI 趋势图"></div>
    <div class="table-tools" id="drillTableTools"></div>
    <div class="table-wrap"><table id="drillTable"></table></div>
    <div class="pager" id="drillPager"></div>
  </section>

  <script src="/echarts.min.js"></script>
  <script>
    document.querySelector('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    // 统一按北京时间计算默认日期，避免访客电脑时区不同导致日期偏移。
    function beijingDateOffset(days) {
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date()).filter((part) => part.type !== "literal")
          .map((part) => [part.type, Number(part.value)])
      );
      return new Date(Date.UTC(parts.year, parts.month - 1, parts.day + days))
        .toISOString()
        .slice(0, 10);
    }
    const defaultEndDate = beijingDateOffset(-1);
    const defaultMonthStart = `${defaultEndDate.slice(0, 8)}01`;
    document.querySelector("#start").value = defaultMonthStart;
    document.querySelector("#end").value = defaultEndDate;
    (() => {
      "use strict";

      const pageSize = 20;
      const dimensions = {
        by_optimizer: { label: "优化师", key: "优化师" },
        by_date: { label: "日期", key: "日期" },
        by_media: { label: "媒体", key: "媒体" },
        by_account: { label: "媒体账户", key: "媒体账户名称" },
        by_promoter: { label: "推客", key: "推客用户名" },
      };
      const drilldowns = {
        by_optimizer: {
          source: "by_optimizer",
          dateSource: "by_optimizer_date",
          valueKey: "优化师",
          selectorLabel: "优化师关联日期",
          autoOpen: true,
          title: (item) => String(item.优化师),
        },
        by_account: {
          source: "by_account",
          dateSource: "by_account_date",
          valueKey: "媒体账户ID",
          selectorLabel: "媒体账户关联日期",
          title: (item) => `${item.媒体账户名称}（${item.媒体账户ID}）`,
        },
        by_media: {
          source: "by_media",
          dateSource: "by_media_date",
          valueKey: "媒体",
          selectorLabel: "媒体关联日期",
          title: (item) => String(item.媒体),
        },
        by_promoter: {
          source: "by_promoter",
          dateSource: "by_promoter_date",
          valueKey: "推客用户名",
          selectorLabel: "推客关联日期",
          title: (item) => String(item.推客用户名),
        },
      };
      const metricColumns = [
        "消耗",
        "转化数",
        "计费转化数",
        "有效订单数",
        "有效首购率",
        "转化成本",
        "条件内预估赔付金额",
        "首购预估佣金",
        "回流预估佣金",
        "预估佣金合计",
        "预估利润",
        "预估ROI",
        "首购实际佣金",
        "回流实际佣金",
        "实际佣金合计",
        "实际利润",
        "实际ROI",
        "去重订单总数",
        "首购订单总数",
        "回流订单总数",
        "首购有效订单数",
        "回流有效订单数",
        "首购无效订单数",
        "回流无效订单数",
        "首购已完成订单",
        "回流已完成订单",
      ];
      const moneyFields = new Set([
        "消耗",
        "转化成本",
        "条件内预估赔付金额",
        "首购预估佣金",
        "回流预估佣金",
        "预估佣金合计",
        "预估利润",
        "首购实际佣金",
        "回流实际佣金",
        "实际佣金合计",
        "实际利润",
      ]);
      const percentFields = new Set(["有效首购率", "预估ROI", "实际ROI"]);
      const profitFields = new Set(["预估利润", "实际利润"]);

      let report = null;
      let active = "by_optimizer";
      let page = 1;
      let drillPage = 1;
      let mainChart = null;
      let drillChart = null;
      const selectedDrillValues = {
        by_optimizer: "",
        by_account: "",
        by_media: "",
        by_promoter: "",
      };
      const isAdmin = () => window.currentSessionUser?.role === "admin";
      const tableSettingsStorageKey = "jd-table-settings-v1";
      let tableSettings = (() => {
        try {
          const parsed = JSON.parse(localStorage.getItem(tableSettingsStorageKey) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      })();

      const $ = (selector) => document.querySelector(selector);
      const number = (value) => {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : 0;
      };
      const escapeHtml = (value) => String(value ?? "-")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      // 下钻名称来自底表，使用 DOM Option，避免将数据文本解释为 HTML。
      function setSelectOptions(select, entries) {
        const fragment = document.createDocumentFragment();
        for (const [value, label] of entries) {
          const option = document.createElement("option");
          option.value = String(value ?? "");
          option.textContent = String(label ?? value ?? "");
          fragment.appendChild(option);
        }
        select.replaceChildren(fragment);
      }
      const numberFormatters = new Map();
      const formatNumber = (value, minimumFractionDigits = 0) => {
        if (!numberFormatters.has(minimumFractionDigits)) {
          numberFormatters.set(minimumFractionDigits, new Intl.NumberFormat("zh-CN", {
            minimumFractionDigits,
            maximumFractionDigits: 2,
          }));
        }
        return numberFormatters.get(minimumFractionDigits).format(number(value));
      };
      const percentFormatter = new Intl.NumberFormat("zh-CN", {
        style: "percent",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      const formatPercent = (value) => percentFormatter.format(number(value));

      function setStatus(message, tone = "") {
        const status = $("#status");
        status.textContent = message;
        status.className = `note status${tone ? ` ${tone}` : ""}`;
      }

      async function copyToken() {
        if (!isAdmin()) return;
        try {
          const credentials = await get("/api/report-credentials");
          const token = String(credentials.token || "").trim();
          if (credentials.userId) $("#userId").value = credentials.userId;
          if (!token) throw new Error("服务器尚未保存 x-token，请先成功更新一次全量数据。");
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(token);
          } else {
            const field = document.createElement("textarea");
            field.value = token;
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.appendChild(field);
            field.select();
            document.execCommand("copy");
            field.remove();
          }
          setStatus("服务器保存的 x-token 已复制到剪贴板。", "success");
        } catch (error) {
          setStatus(error.message || "浏览器未允许自动复制，请检查剪贴板权限。", "error");
        }
      }

      function saveTableSettings() {
        try {
          localStorage.setItem(tableSettingsStorageKey, JSON.stringify(tableSettings));
        } catch {
          // 浏览器禁用本地存储时，设置仅在当前页面生效。
        }
      }

      function tableSetting(scope) {
        tableSettings[scope] ??= {};
        return tableSettings[scope];
      }

      function sortRows(rows, scope) {
        const setting = tableSetting(scope);
        if (!setting.sortColumn) return [...rows];
        const direction = setting.sortDirection === "desc" ? -1 : 1;
        return [...rows].sort((left, right) => {
          const leftValue = left[setting.sortColumn];
          const rightValue = right[setting.sortColumn];
          const leftNumber = Number(leftValue);
          const rightNumber = Number(rightValue);
          if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) {
            return (leftNumber - rightNumber) * direction;
          }
          return String(leftValue ?? "").localeCompare(String(rightValue ?? ""), "zh-CN", {
            numeric: true,
            sensitivity: "base",
          }) * direction;
        });
      }

      function renderTableTools(target, scope, allColumns, fixedColumns) {
        const setting = tableSetting(scope);
        const selectedColumns = Array.isArray(setting.columns) ? setting.columns : allColumns;
        const wasOpen = target.querySelector("details")?.open;
        const selectedCount = allColumns.filter((column) => fixedColumns.includes(column) || selectedColumns.includes(column)).length;
        target.dataset.tableScope = scope;
        target.innerHTML = `
          <details class="column-menu" ${wasOpen ? "open" : ""}>
            <summary>选择列（${selectedCount}/${allColumns.length}）</summary>
            <div class="column-picker">
              ${allColumns.map((column) => {
                const fixed = fixedColumns.includes(column);
                const checked = fixed || selectedColumns.includes(column);
                return `<label><input type="checkbox" data-table-column="${escapeHtml(column)}" ${checked ? "checked" : ""} ${fixed ? "disabled" : ""}>${escapeHtml(column)}</label>`;
              }).join("")}
            </div>
          </details>
          <button class="column-reset" type="button" data-reset-columns>恢复默认列</button>
          <span>点击表头可切换升序/降序</span>
        `;
      }

      function tableView(rows, allColumns, fixedColumns, scope, tools) {
        const setting = tableSetting(scope);
        const selectedColumns = Array.isArray(setting.columns) ? setting.columns : allColumns;
        const columns = allColumns.filter((column) => fixedColumns.includes(column) || selectedColumns.includes(column));
        renderTableTools(tools, scope, allColumns, fixedColumns);
        return { rows: sortRows(rows, scope), columns };
      }

      function toggleSort(scope, column) {
        const setting = tableSetting(scope);
        if (setting.sortColumn === column) {
          setting.sortDirection = setting.sortDirection === "asc" ? "desc" : "asc";
        } else {
          setting.sortColumn = column;
          setting.sortDirection = "asc";
        }
        saveTableSettings();
      }

      function updateColumnsFromTools(tools) {
        const scope = tools.dataset.tableScope;
        const checked = [...tools.querySelectorAll("input[data-table-column]:checked")]
          .map((input) => input.dataset.tableColumn);
        tableSetting(scope).columns = checked;
        saveTableSettings();
      }

      function formatCell(value, column, dimensionKey, row) {
        if (column === "优化师" && dimensionKey === "优化师") {
          return `<button class="drill-link" type="button" data-drill-dimension="by_optimizer" data-drill-value="${escapeHtml(value)}">${escapeHtml(value)}</button>`;
        }
        if (column === "媒体账户名称" && dimensionKey === "媒体账户名称") {
          return `<button class="drill-link" type="button" data-drill-dimension="by_account" data-drill-value="${escapeHtml(row.媒体账户ID)}">${escapeHtml(value)}</button>`;
        }
        if (column === "媒体账户ID" && dimensionKey === "媒体账户名称") {
          return `<button class="drill-link" type="button" data-drill-dimension="by_account" data-drill-value="${escapeHtml(value)}">${escapeHtml(value)}</button>`;
        }
        if (column === "媒体" && dimensionKey === "媒体") {
          return `<button class="drill-link" type="button" data-drill-dimension="by_media" data-drill-value="${escapeHtml(value)}">${escapeHtml(value)}</button>`;
        }
        if (column === "推客用户名" && dimensionKey === "推客用户名") {
          return `<button class="drill-link" type="button" data-drill-dimension="by_promoter" data-drill-value="${escapeHtml(value)}">${escapeHtml(value)}</button>`;
        }
        if (column === dimensionKey || column === "日期") return escapeHtml(value);
        if (percentFields.has(column)) return formatPercent(value);
        if (moneyFields.has(column)) return formatNumber(value, 2);
        return formatNumber(value);
      }

      function cellClass(row, column) {
        if (!profitFields.has(column)) return "";
        return number(row[column]) < 0 ? "bad" : "good";
      }

      function renderTable(target, rows, columns, dimensionKey, scope) {
        const setting = tableSetting(scope);
        const head = `<thead><tr>${columns.map((column) => {
          const indicator = setting.sortColumn === column
            ? `<span class="sort-indicator">${setting.sortDirection === "desc" ? "▼" : "▲"}</span>`
            : "";
          return `<th><button class="sort-button" type="button" data-sort-column="${escapeHtml(column)}">${escapeHtml(column)}${indicator}</button></th>`;
        }).join("")}</tr></thead>`;
        const body = rows.length
          ? rows.map((row) => `<tr>${columns.map((column) => `<td class="${cellClass(row, column)}">${formatCell(row[column], column, dimensionKey, row)}</td>`).join("")}</tr>`).join("")
          : `<tr><td class="empty-cell" colspan="${columns.length}">当前条件下暂无数据</td></tr>`;
        target.innerHTML = `${head}<tbody>${body}</tbody>`;
      }

      function renderPager(target, total, current) {
        const pages = Math.max(1, Math.ceil(total / pageSize));
        target.innerHTML = `
          <span>共 ${total} 条，第 ${current}/${pages} 页</span>
          <button type="button" data-step="-1" ${current === 1 ? "disabled" : ""}>上一页</button>
          <button type="button" data-step="1" ${current === pages ? "disabled" : ""}>下一页</button>
        `;
      }

      function renderCards() {
        const summary = report.summary || {};
        const items = [
          { label: "明细行数", value: report.rows, type: "number" },
          { label: "消耗", value: summary.消耗, type: "money" },
          { label: "转化数", value: summary.转化数, type: "number" },
          { label: "计费转化数", value: summary.计费转化数, type: "number" },
          { label: "有效订单数", value: summary.有效订单数, type: "number" },
          { label: "有效首购率", value: summary.有效首购率, type: "percent" },
          { label: "转化成本", value: summary.转化成本, type: "money" },
          { label: "条件内预估赔付", value: summary.条件内预估赔付金额, type: "money" },
          { label: "预估佣金合计", value: summary.预估佣金合计, type: "money" },
          { label: "预估利润", value: summary.预估利润, type: "money", profit: true },
          { label: "预估 ROI", value: summary.预估ROI, type: "percent" },
          { label: "实际佣金合计", value: summary.实际佣金合计, type: "money" },
          { label: "实际利润", value: summary.实际利润, type: "money", profit: true },
          { label: "实际 ROI", value: summary.实际ROI, type: "percent" },
        ];
        $("#cards").innerHTML = items.map((item) => {
          const formatted = item.type === "percent"
            ? formatPercent(item.value)
            : formatNumber(item.value, item.type === "money" ? 2 : 0);
          const tone = item.profit ? (number(item.value) < 0 ? "bad" : "good") : "";
          return `<article class="card"><div class="k">${escapeHtml(item.label)}</div><div class="v ${tone}">${formatted}</div></article>`;
        }).join("");
      }

      function trendRows(rows) {
        return [...rows].sort((left, right) => String(left.日期 || "").localeCompare(String(right.日期 || "")));
      }

      function renderTrend(element, instance, rows) {
        const ordered = trendRows(rows);
        const chart = instance || echarts.init(element);
        chart.setOption({
          animationDuration: 350,
          color: ["#e1251b", "#f59e0b", "#1677ff"],
          grid: { left: 72, right: 72, top: 38, bottom: 66 },
          legend: { top: 6, right: 24, data: ["消耗", "预估 ROI", "实际 ROI"] },
          tooltip: {
            trigger: "axis",
            formatter(params) {
              const row = ordered[params[0]?.dataIndex] || {};
              return [
                escapeHtml(row.日期 || "-"),
                `消耗：${formatNumber(row.消耗, 2)}`,
                `计费转化数：${formatNumber(row.计费转化数)}`,
                `预估 ROI：${formatPercent(row.预估ROI)}`,
                `实际利润：${formatNumber(row.实际利润, 2)}`,
                `实际 ROI：${formatPercent(row.实际ROI)}`,
              ].join("<br>");
            },
          },
          xAxis: {
            type: "category",
            data: ordered.map((row) => row.日期),
            axisLabel: { rotate: 35 },
            axisTick: { alignWithLabel: true },
          },
          yAxis: [
            {
              type: "value",
              name: "消耗",
              splitLine: { lineStyle: { color: "#e8eef5" } },
            },
            {
              type: "value",
              name: "ROI",
              axisLabel: { formatter: (value) => `${value}%` },
              splitLine: { show: false },
            },
          ],
          dataZoom: [
            { type: "inside" },
            { type: "slider", height: 18, bottom: 8 },
          ],
          series: [
            {
              name: "消耗",
              type: "line",
              data: ordered.map((row) => number(row.消耗)),
              smooth: true,
              symbolSize: 6,
              lineStyle: { width: 3 },
            },
            {
              name: "预估 ROI",
              type: "line",
              yAxisIndex: 1,
              data: ordered.map((row) => Number((number(row.预估ROI) * 100).toFixed(2))),
              smooth: true,
              symbolSize: 6,
              lineStyle: { width: 2 },
            },
            {
              name: "实际 ROI",
              type: "line",
              yAxisIndex: 1,
              data: ordered.map((row) => Number((number(row.实际ROI) * 100).toFixed(2))),
              smooth: true,
              symbolSize: 6,
              lineStyle: { width: 2 },
              markLine: {
                silent: true,
                symbol: "none",
                lineStyle: { type: "dashed", color: "#98a2b3", width: 1.5 },
                label: {
                  show: true,
                  formatter: "ROI = 1",
                  color: "#667085",
                  position: "insideEndTop",
                },
                data: [{ yAxis: 100 }],
              },
            },
          ],
        }, { notMerge: true });
        return chart;
      }

      function renderMain() {
        const config = dimensions[active];
        const rows = Array.isArray(report[active]) ? report[active] : [];
        const pages = Math.max(1, Math.ceil(rows.length / pageSize));
        page = Math.min(page, pages);
        const range = Array.isArray(report.range) ? report.range : ["-", "-"];
        const optimizerFilterText = report.excludeUnknownOptimizer ? "，已排除未知优化师" : "，包含未知优化师";
        $("#insight").textContent = `数据范围：${range[0]} 至 ${range[1]}，当前按${config.label}汇总，共 ${rows.length} 条${optimizerFilterText}。`;

        const allColumns = active === "by_account"
          ? [config.key, "媒体账户ID", ...metricColumns]
          : [config.key, ...metricColumns];
        const scope = `main:${active}`;
        const view = tableView(rows, allColumns, [config.key], scope, $("#mainTableTools"));
        const visibleRows = view.rows.slice((page - 1) * pageSize, page * pageSize);
        renderTable($("#table"), visibleRows, view.columns, config.key, scope);
        renderPager($("#pager"), rows.length, page);

        const chartSection = $("#mainChartSection");
        if (active === "by_date") {
          $("#mainChartTitle").textContent = "京东 CPA 每日消耗、预估 ROI 与实际 ROI 趋势";
          chartSection.classList.remove("hidden");
          mainChart = renderTrend($("#mainChart"), mainChart, rows);
          requestAnimationFrame(() => mainChart?.resize());
        } else {
          chartSection.classList.add("hidden");
        }

        renderDrilldown();
      }

      function renderDrilldown() {
        const panel = $("#drillPanel");
        const config = drilldowns[active];
        if (!config) {
          panel.classList.add("hidden");
          return;
        }

        const choices = Array.isArray(report[config.source]) ? report[config.source] : [];
        const requested = selectedDrillValues[active];
        if (!choices.length || (!config.autoOpen && !requested)) {
          panel.classList.add("hidden");
          return;
        }

        panel.classList.remove("hidden");
        const select = $("#drillSelect");
        setSelectOptions(
          select,
          choices.map((item) => [item[config.valueKey], config.title(item)]),
        );
        const selected = choices.some((item) => String(item[config.valueKey]) === requested)
          ? requested
          : String(choices[0][config.valueKey]);
        selectedDrillValues[active] = selected;
        select.value = selected;

        const source = report[config.dateSource];
        const rows = (Array.isArray(source) ? source : [])
          .filter((item) => String(item[config.valueKey]) === selected)
          .sort((left, right) => String(right.日期 || "").localeCompare(String(left.日期 || "")));
        const pages = Math.max(1, Math.ceil(rows.length / pageSize));
        drillPage = Math.min(drillPage, pages);

        const selectedChoice = choices.find((item) => String(item[config.valueKey]) === selected);
        const title = selectedChoice ? config.title(selectedChoice) : selected;
        $("#drillSelectLabel").childNodes[0].textContent = `${config.selectorLabel} `;
        $("#drillNote").textContent = `${title} 的关联日期数据，共 ${rows.length} 天；表格按日期降序展示。`;
        $("#drillChartTitle").textContent = `${title} 每日消耗、预估 ROI 与实际 ROI 趋势`;
        $("#drillChart").setAttribute("aria-label", `${title} 每日消耗、预估 ROI 与实际 ROI 趋势图`);
        drillChart = renderTrend($("#drillChart"), drillChart, rows);
        requestAnimationFrame(() => drillChart?.resize());

        const allColumns = ["日期", ...metricColumns];
        const scope = `drill:${active}`;
        const view = tableView(rows, allColumns, ["日期"], scope, $("#drillTableTools"));
        const visibleRows = view.rows.slice((drillPage - 1) * pageSize, drillPage * pageSize);
        renderTable($("#drillTable"), visibleRows, view.columns, "日期", scope);
        renderPager($("#drillPager"), rows.length, drillPage);
      }

      function showReport() {
        $("#filterPanel").classList.remove("hidden");
        $("#cards").classList.remove("hidden");
        $("#tabs").classList.remove("hidden");
        $("#content").classList.remove("hidden");
        renderCards();
        renderMain();
      }

      function cacheText() {
        const updated = report.cachedAt
          ? `已查询 MySQL，最近同步：${new Date(report.cachedAt).toLocaleString("zh-CN")}。`
          : "已查询 MySQL。";
        const next = report.nextScheduledRefreshAt
          ? ` 下次自动更新：${new Date(report.nextScheduledRefreshAt).toLocaleString("zh-CN")}。`
          : " 每天 09:00 自动更新。";
        return updated + next;
      }

      async function requestJson(url, options) {
        const response = await fetch(url, options);
        if (response.status === 401) {
          location.replace("/login");
          throw new Error("登录已失效");
        }
        const raw = await response.text();
        let result;
        try {
          result = JSON.parse(raw);
        } catch {
          throw new Error("服务端接口暂不可用，请确认已拉取最新代码并重启服务");
        }
        if (!response.ok) throw new Error(result.error || "请求失败");
        return result;
      }

      function get(url) {
        return requestJson(url, { cache: "no-store" });
      }

      function post(url, body) {
        return requestJson(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      }

      async function loadLatest() {
        if (!isAdmin()) return;
        const token = $("#token").value.trim();
        if (!token) {
          setStatus("请粘贴当前 x-token 后再更新数据。", "error");
          $("#token").focus();
          return;
        }

        const button = $("#load");
        try {
          button.disabled = true;
          button.textContent = "加载中…";
          setStatus("正在获取并保存京东全量报表…");
          await post("/api/jd/load", {
            token,
            userId: $("#userId").value.trim() || "20",
            excludeUnknownOptimizer: $("#excludeUnknownOptimizer").value === "true",
          });
          report = await post("/api/jd/analyze", {
            start: $("#start").value,
            end: $("#end").value,
            accountId: $("#accountId").value.trim(),
            excludeUnknownOptimizer: $("#excludeUnknownOptimizer").value === "true",
          });
          $("#token").value = "";
          page = 1;
          drillPage = 1;
          showReport();
          setStatus(`京东数据和 x-token 已保存到服务器。${cacheText()} 已启用每日自动更新。`, "success");
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          button.disabled = false;
          button.textContent = "更新京东全量数据";
        }
      }

      async function applyDateFilter(reset = false) {
        const start = reset ? defaultMonthStart : $("#start").value;
        const end = reset ? defaultEndDate : $("#end").value;
        if (start && end && start > end) {
          $("#loading").textContent = "开始日期不能晚于结束日期。";
          return;
        }

        const button = $("#apply");
        try {
          button.disabled = true;
          $("#reset").disabled = true;
          $("#loading").textContent = "计算中…";
          report = await post("/api/jd/analyze", {
            start,
            end,
            accountId: $("#accountId").value.trim(),
            excludeUnknownOptimizer: $("#excludeUnknownOptimizer").value === "true",
          });
          if (reset) {
            $("#start").value = defaultMonthStart;
            $("#end").value = defaultEndDate;
          }
          page = 1;
          drillPage = 1;
          showReport();
          $("#loading").textContent = "筛选已应用。";
        } catch (error) {
          $("#loading").textContent = error.message;
        } finally {
          button.disabled = false;
          $("#reset").disabled = false;
        }
      }

      $("#load").addEventListener("click", loadLatest);
      $("#copyToken").addEventListener("click", copyToken);
      $("#apply").addEventListener("click", () => applyDateFilter(false));
      $("#accountId").addEventListener("keydown", (event) => {
        if (event.key === "Enter") applyDateFilter(false);
      });
      $("#reset").addEventListener("click", () => applyDateFilter(true));

      $("#tabs").addEventListener("click", (event) => {
        const tab = event.target.closest("button[data-key]");
        if (!tab) return;
        active = tab.dataset.key;
        page = 1;
        drillPage = 1;
        document.querySelectorAll(".tab").forEach((item) => {
          const selected = item === tab;
          item.classList.toggle("active", selected);
          item.setAttribute("aria-selected", String(selected));
        });
        renderMain();
      });

      $("#pager").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-step]");
        if (!button) return;
        page += Number(button.dataset.step);
        renderMain();
      });

      $("#table").addEventListener("click", (event) => {
        const sortButton = event.target.closest("button[data-sort-column]");
        if (sortButton) {
          toggleSort(`main:${active}`, sortButton.dataset.sortColumn);
          page = 1;
          renderMain();
          return;
        }
        const link = event.target.closest("button[data-drill-dimension]");
        if (!link) return;
        const dimension = link.dataset.drillDimension;
        if (dimension !== active || !drilldowns[dimension]) return;
        selectedDrillValues[dimension] = link.dataset.drillValue || "";
        drillPage = 1;
        renderDrilldown();
        requestAnimationFrame(() => $("#drillPanel").scrollIntoView({ behavior: "smooth", block: "start" }));
      });

      $("#drillTable").addEventListener("click", (event) => {
        const sortButton = event.target.closest("button[data-sort-column]");
        if (!sortButton) return;
        toggleSort(`drill:${active}`, sortButton.dataset.sortColumn);
        drillPage = 1;
        renderDrilldown();
      });

      $("#mainTableTools").addEventListener("change", () => {
        updateColumnsFromTools($("#mainTableTools"));
        page = 1;
        renderMain();
      });

      $("#drillTableTools").addEventListener("change", () => {
        updateColumnsFromTools($("#drillTableTools"));
        drillPage = 1;
        renderDrilldown();
      });

      $("#mainTableTools").addEventListener("click", (event) => {
        if (!event.target.closest("[data-reset-columns]")) return;
        delete tableSetting(`main:${active}`).columns;
        saveTableSettings();
        renderMain();
      });

      $("#drillTableTools").addEventListener("click", (event) => {
        if (!event.target.closest("[data-reset-columns]")) return;
        delete tableSetting(`drill:${active}`).columns;
        saveTableSettings();
        renderDrilldown();
      });

      $("#drillSelect").addEventListener("change", (event) => {
        if (drilldowns[active]) selectedDrillValues[active] = event.target.value;
        drillPage = 1;
        renderDrilldown();
      });

      $("#drillPager").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-step]");
        if (!button) return;
        drillPage += Number(button.dataset.step);
        renderDrilldown();
      });

      let resizeFrame = 0;
      window.addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          mainChart?.resize();
          drillChart?.resize();
        });
      });

      window.getPetReportContext = () => ({
        reportType: "京东 CPA 日报",
        range: report?.range || ["-", "-"],
        summary: report?.summary || {},
        excludeUnknownOptimizer: report?.excludeUnknownOptimizer ?? true,
        accountId: $("#accountId").value.trim(),
        currentDimension: dimensions[active]?.label || "优化师",
        topOptimizers: (report?.by_optimizer || []).slice(0, 12),
        currentRows: (report?.[active] || []).slice(0, 12),
        alerts: { total: 0 },
      });

      post("/api/jd/analyze", {
        start: defaultMonthStart,
        end: defaultEndDate,
        accountId: "",
        excludeUnknownOptimizer: true,
      })
        .then((current) => {
          report = current;
          showReport();
          setStatus(cacheText(), "success");
        })
        .catch((error) => {
          setStatus(
            error.message || (isAdmin()
              ? "MySQL 暂无京东数据，请粘贴 x-token 后加载一次。"
              : "当前暂无京东报表数据，请联系管理员更新全量数据。"),
            "error"
          );
        });
    })();
  </script>
