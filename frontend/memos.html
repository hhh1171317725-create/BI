<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>备忘录 · 营销数据工作台</title>
  <link rel="stylesheet" href="/app-ui.css?v=6">
  <link rel="stylesheet" href="/memos.css?v=2">
  <script src="/report-visibility.js?v=3" defer></script>
  <script src="/app-ui.js?v=20261009-games" defer></script>
  <script src="/memos.js?v=2" defer></script>
  <script src="/pet-loader.js?v=20261009-assistant" defer></script>
</head>
<body>
  <header><div class="brand"><span class="memo-mark">记</span><div><h1>备忘录</h1><p>随手记录，随时找到。</p></div></div><span class="private-label">仅自己可见 · 数据保存在网站</span></header>
  <main>
    <div class="page-heading"><div><h2>我的备忘录</h2><p>用标签归类信息，把常用内容置顶。</p></div><button id="newMemo" class="primary" disabled>＋ 新建备忘录</button></div>
    <div id="message" role="status" aria-live="polite"></div>
    <section class="memo-workspace" aria-label="备忘录工作区">
      <aside class="memo-browser" aria-label="查找备忘录">
        <form id="searchForm" class="memo-search"><label for="search">搜索信息</label><input id="search" type="search" maxlength="100" placeholder="搜索标题、正文、标签" autocomplete="off"><span class="search-hint">多个关键词用空格分隔</span></form>
        <div class="memo-views" aria-label="备忘录分类"><button data-view="all" aria-pressed="true">全部 <span id="totalCount">0</span></button><button data-view="pinned" aria-pressed="false">置顶 <span id="pinCount">0</span></button><button data-view="trash" aria-pressed="false">回收站 <span id="trashCount">0</span></button></div>
        <label class="tag-filter" for="tagFilter">标签<select id="tagFilter"><option value="">全部标签</option></select></label>
        <div class="list-heading"><span id="listStatus" role="status">正在加载…</span><button id="refresh" class="text-button" type="button">刷新</button></div>
        <div id="memoList" class="memo-list" aria-label="备忘录列表"></div>
        <button id="loadMore" class="load-more" hidden>加载更多</button>
      </aside>
      <section class="memo-detail" aria-label="备忘录内容">
        <div id="emptyEditor" class="empty-editor"><span class="empty-icon" aria-hidden="true">记</span><h2>让信息有个去处</h2><p>记录账户信息、操作步骤或临时想法。<br>选择左侧备忘录，或新建一条开始记录。</p><button id="emptyNew" class="primary" disabled>新建备忘录</button></div>
        <div id="draftNotice" class="draft-notice" hidden><span id="draftText"></span><div><button id="recoverDraft" type="button">恢复草稿</button><button id="discardDraft" type="button">丢弃草稿</button></div></div>
        <form id="editor" hidden>
          <div class="editor-toolbar"><span id="saveState" role="status">未保存</span><div class="editor-actions"><button id="copy" type="button">复制正文</button><button id="remove" type="button" class="danger">删除</button><button id="restore" type="button" hidden>恢复备忘录</button><button id="save" type="submit" class="primary">保存</button></div></div>
          <fieldset id="fields"><label class="title-label" for="title">标题<input id="title" maxlength="160" required placeholder="给这条信息起个容易找到的标题"></label><div class="editor-properties"><label for="tags">标签<input id="tags" maxlength="256" placeholder="例如：账户，投放技巧，常用链接"></label><label class="pin-toggle"><input id="pinned" type="checkbox">置顶</label></div><label class="content-label" for="content">正文<textarea id="content" maxlength="50000" placeholder="在这里记录信息，支持多行文字和链接…"></textarea></label></fieldset>
          <div class="editor-footer"><span id="timestamps"></span><span id="charCount">0 / 50,000 字符</span></div>
        </form>
      </section>
    </section>
    <p class="page-footnote">Ctrl / ⌘ + S 保存 · 标签用逗号分隔 · 删除后可在回收站恢复</p>
  </main>
</body>
</html>
