<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(result=>{if(!result.authenticated)throw Error();document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <title>Todo 任务</title>
  <script src="/report-visibility.js"></script>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--bad:#cf3d3d;--warn:#b54708;--good:#16845b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}header{padding:18px 32px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:#202b3d;color:#fff;font-weight:700}h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:6px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.secondary{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button,.secondary{line-height:normal}.nav a:hover,.nav button:hover,.secondary:hover{border-color:var(--blue);background:#eaf3ff}.page{max-width:1080px;margin:20px auto;padding:0 24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.segments{display:flex;padding:3px;border:1px solid var(--line);border-radius:7px;background:#fff}.segments button{height:30px;padding:0 13px;border:0;border-radius:4px;background:transparent;color:var(--muted);font:600 13px inherit;cursor:pointer}.segments button.active{background:#eaf3ff;color:#0958d9}.float-button{height:38px;padding:0 15px;border:0;border-radius:5px;background:#202b3d;color:#fff;font:600 14px inherit;cursor:pointer}.float-button:hover{background:#111827}.composer{display:grid;grid-template-columns:minmax(220px,1fr) 150px 130px auto;gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}input,select{height:38px;width:100%;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:var(--ink);font:inherit}.primary{height:38px;padding:0 18px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}.primary:hover{background:#0958d9}.primary:disabled{opacity:.55;cursor:wait}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px 10px}.summary h2{margin:0;font-size:16px}.count{color:var(--muted);font-size:13px}.task-list{background:#fff;border-top:1px solid var(--line)}.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:62px;padding:11px 14px;border-bottom:1px solid #e8edf3}.task:hover{background:#fafcff}.task input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--blue);cursor:pointer}.task-main{min-width:0}.task-title{font-weight:600;line-height:1.45;overflow-wrap:anywhere}.task.completed .task-title{text-decoration:line-through;color:#8a94a6}.meta{display:flex;align-items:center;gap:8px;min-height:20px;margin-top:4px;color:var(--muted);font-size:12px}.priority{display:inline-flex;align-items:center;gap:5px}.priority::before{content:"";width:7px;height:7px;border-radius:50%;background:#98a2b3}.priority.high{color:var(--bad)}.priority.high::before{background:var(--bad)}.priority.low{color:var(--good)}.priority.low::before{background:var(--good)}.due.overdue{color:var(--bad);font-weight:600}.task-actions{display:flex;gap:4px}.icon-button{width:34px;height:34px;padding:0;border:0;border-radius:5px;background:transparent;color:#526174;font:600 13px inherit;cursor:pointer}.icon-button:hover{background:#eaf3ff;color:#0958d9}.icon-button.delete:hover{background:#fff1f0;color:var(--bad)}.empty{padding:64px 20px;text-align:center;color:var(--muted);background:#fff;border-bottom:1px solid var(--line)}.status{min-height:21px;margin:10px 2px;color:var(--muted);font-size:12px}.status.error{color:var(--bad)}dialog{width:min(480px,calc(100vw - 28px));padding:0;border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 60px rgba(23,43,77,.25)}dialog::backdrop{background:rgba(23,43,77,.35)}.dialog-body{padding:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:17px}.close{width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.edit-grid{display:grid;gap:12px;margin-top:16px}.edit-grid label{display:grid;gap:7px;color:#475467;font-weight:600}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    body.compact header{display:none}body.compact .page{margin:0;padding:12px}body.compact .float-button{display:none}@media(max-width:700px){header{padding:16px}.header-row{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.nav a,.nav button{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 8px;text-align:center}.page{margin:12px auto;padding:0 12px}.toolbar{align-items:stretch;flex-direction:column}.segments{display:grid;grid-template-columns:repeat(3,1fr)}.float-button{width:100%}.composer{grid-template-columns:1fr 1fr}.composer #newTitle{grid-column:1/-1}.composer .primary{grid-column:1/-1}.task{grid-template-columns:26px minmax(0,1fr);padding:10px}.task-actions{grid-column:2;justify-content:flex-end}.summary{align-items:flex-start}.task-list{margin:0 -12px}.empty{margin:0 -12px}}@media(max-width:390px){.composer{grid-template-columns:1fr}.composer #newTitle,.composer .primary{grid-column:auto}.nav{grid-template-columns:1fr}.meta{align-items:flex-start;flex-direction:column;gap:3px}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">待</span><h1>Todo 任务</h1></div><p>个人任务清单。</p></div><nav class="nav"><a href="/tools">工具中心</a><a href="/">大航海日报</a><a href="/jd">京东广义新</a><a href="/jd-low-activity">京东低活</a><a href="/account">设置</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main class="page">
    <div class="toolbar"><div class="segments" id="filters" role="tablist"><button class="active" data-filter="active" type="button">待完成</button><button data-filter="all" type="button">全部</button><button data-filter="completed" type="button">已完成</button></div><button class="float-button" id="floatTodo" type="button">悬浮到桌面</button></div>
    <form class="composer" id="composer"><input id="newTitle" maxlength="240" autocomplete="off" placeholder="添加一个任务" aria-label="任务内容" required /><select id="newPriority" aria-label="优先级"><option value="normal">普通优先级</option><option value="high">高优先级</option><option value="low">低优先级</option></select><input id="newDueDate" type="date" aria-label="截止日期" /><button class="primary" id="addTask" type="submit">添加任务</button></form>
    <div class="summary"><h2 id="listTitle">待完成</h2><span class="count" id="count"></span></div><section class="task-list" id="taskList" aria-live="polite"></section><div class="status" id="status"></div>
  </main>
  <dialog id="editDialog"><form class="dialog-body" id="editForm"><div class="dialog-head"><h2>编辑任务</h2><button class="close" id="closeEdit" type="button" aria-label="关闭">×</button></div><div class="edit-grid"><label>任务内容<input id="editTitle" maxlength="240" required /></label><label>优先级<select id="editPriority"><option value="normal">普通</option><option value="high">高</option><option value="low">低</option></select></label><label>截止日期<input id="editDueDate" type="date" /></label></div><div class="dialog-actions"><button class="secondary" id="cancelEdit" type="button">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
  <script>
    const $=selector=>document.querySelector(selector),channel='BroadcastChannel'in window?new BroadcastChannel('marketing-todo-v1'):null;
    let items=[],filter='active',editingId=null,pipWindow=null,refreshTimer=null;
    if(new URLSearchParams(location.search).get('compact')==='1')document.body.classList.add('compact');
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    async function request(url,options={}){const response=await fetch(url,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});if(response.status===401){location.replace('/login');throw Error('登录已失效')}const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    function setStatus(message,tone=''){const el=$('#status');el.textContent=message;el.className=`status ${tone}`}
    function visibleItems(){return items.filter(item=>filter==='all'||(filter==='active'?!item.completed:item.completed))}
    function priorityText(value){return value==='high'?'高优先级':value==='low'?'低优先级':'普通优先级'}
    function dueText(value){if(!value)return'';const date=new Date(`${value}T00:00:00`),today=new Date();today.setHours(0,0,0,0);const overdue=date<today;return`<span class="due ${overdue?'overdue':''}">${overdue?'已逾期 · ':''}${date.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}</span>`}
    function render(){const shown=visibleItems(),activeCount=items.filter(item=>!item.completed).length;$('#listTitle').textContent=filter==='all'?'全部任务':filter==='completed'?'已完成':'待完成';$('#count').textContent=`${activeCount} 项待完成 · 共 ${items.length} 项`;$('#taskList').innerHTML=shown.length?shown.map(item=>`<article class="task ${item.completed?'completed':''}" data-id="${item.id}"><input type="checkbox" ${item.completed?'checked':''} aria-label="${item.completed?'恢复任务':'完成任务'}" data-action="toggle" /><div class="task-main"><div class="task-title">${esc(item.title)}</div><div class="meta"><span class="priority ${esc(item.priority)}">${priorityText(item.priority)}</span>${dueText(item.dueDate)}</div></div><div class="task-actions"><button class="icon-button" type="button" data-action="edit" title="编辑任务">编辑</button><button class="icon-button delete" type="button" data-action="delete" title="删除任务">删除</button></div></article>`).join(''):'<div class="empty">这里还没有任务</div>';renderPip()}
    async function refresh(silent=false){try{const result=await request('/api/todos',{cache:'no-store'});items=result.items||[];render();if(!silent)setStatus('已与服务器同步')}catch(error){setStatus(error.message,'error')}}
    async function createTask(title,priority='normal',dueDate=''){const result=await request('/api/todos',{method:'POST',body:JSON.stringify({title,priority,dueDate})});items=[result.item,...items];render();notify();return result.item}
    async function updateTask(id,changes){const result=await request(`/api/todos/${id}`,{method:'PUT',body:JSON.stringify(changes)});items=items.map(item=>item.id===id?result.item:item);render();notify();return result.item}
    async function deleteTask(id){await request(`/api/todos/${id}`,{method:'DELETE'});items=items.filter(item=>item.id!==id);render();notify()}
    function notify(){channel?.postMessage('changed')}
    async function submitTask(event){event.preventDefault();const button=$('#addTask'),title=$('#newTitle').value.trim();if(!title)return;try{button.disabled=true;await createTask(title,$('#newPriority').value,$('#newDueDate').value);event.target.reset();$('#newTitle').focus();setStatus('任务已添加')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false}}
    async function taskAction(event){const action=event.target.dataset.action;if(!action)return;const row=event.target.closest('.task'),id=Number(row.dataset.id),item=items.find(value=>value.id===id);if(!item)return;try{if(action==='toggle')await updateTask(id,{completed:event.target.checked});if(action==='delete'&&confirm(`确定删除“${item.title}”吗？`))await deleteTask(id);if(action==='edit')openEdit(item)}catch(error){setStatus(error.message,'error');await refresh(true)}}
    function openEdit(item){editingId=item.id;$('#editTitle').value=item.title;$('#editPriority').value=item.priority;$('#editDueDate').value=item.dueDate||'';$('#editDialog').showModal();$('#editTitle').focus()}
    async function saveEdit(event){event.preventDefault();try{await updateTask(editingId,{title:$('#editTitle').value.trim(),priority:$('#editPriority').value,dueDate:$('#editDueDate').value});$('#editDialog').close();setStatus('任务已更新')}catch(error){setStatus(error.message,'error')}}
    function pipStyles(){return`*{box-sizing:border-box}body{margin:0;background:#fff;color:#172b4d;font:14px "Microsoft YaHei","PingFang SC",sans-serif}.shell{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh}.head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e4eaf0}.head strong{font-size:14px}.head span{color:#667085;font-size:12px}.add{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:7px;padding:8px;border-bottom:1px solid #e4eaf0}input{min-width:0;height:32px;padding:0 9px;border:1px solid #c7d3df;border-radius:5px;font:inherit}.add button{width:34px;height:32px;padding:0;border:0;border-radius:5px;background:#1677ff;color:#fff;font:600 20px/1 inherit;cursor:pointer}.list{overflow:auto}.row{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:center;gap:8px;min-height:44px;padding:8px 10px;border-bottom:1px solid #edf1f5}.row input{width:16px;height:16px;margin:0;accent-color:#1677ff;cursor:pointer}.title{line-height:1.4;overflow-wrap:anywhere}.empty{padding:38px 12px;text-align:center;color:#8a94a6}`}
    function renderPip(){if(!pipWindow||pipWindow.closed)return;const doc=pipWindow.document,active=items.filter(item=>!item.completed);const count=doc.querySelector('#pipCount'),list=doc.querySelector('#pipList');if(!count||!list)return;count.textContent=`${active.length} 项`;list.innerHTML=active.length?active.map(item=>`<div class="row" data-id="${item.id}"><input data-pip="toggle" type="checkbox" aria-label="完成任务"><div class="title">${esc(item.title)}</div></div>`).join(''):'<div class="empty">暂无待办</div>'}
    function wirePip(win){const doc=win.document;doc.open();doc.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Todo</title><style>${pipStyles()}</style></head><body><main class="shell"><div class="head"><strong>Todo</strong><span id="pipCount"></span></div><form class="add" id="pipForm"><input id="pipTitle" maxlength="240" autocomplete="off" placeholder="添加任务"><button type="submit" title="添加任务" aria-label="添加任务">+</button></form><section class="list" id="pipList"></section></main></body></html>`);doc.close();doc.querySelector('#pipForm').onsubmit=async event=>{event.preventDefault();const input=doc.querySelector('#pipTitle'),title=input.value.trim();if(!title)return;try{await createTask(title);input.value=''}catch(error){setStatus(error.message,'error')}};doc.querySelector('#pipList').onclick=async event=>{if(event.target.dataset.pip!=='toggle')return;const id=Number(event.target.closest('.row').dataset.id);try{await updateTask(id,{completed:true})}catch(error){setStatus(error.message,'error')}};win.addEventListener('pagehide',()=>{pipWindow=null});renderPip()}
    async function floatTodo(){try{if(pipWindow&&!pipWindow.closed){pipWindow.focus();return}if('documentPictureInPicture'in window){pipWindow=await window.documentPictureInPicture.requestWindow({width:330,height:460});wirePip(pipWindow);setStatus('Todo 已悬浮到桌面')}else{const win=window.open('/todo?compact=1','marketing-todo-float','popup,width=330,height=460');if(!win)throw Error('浏览器拦截了小窗，请允许本站打开弹窗');setStatus('当前浏览器不支持置顶悬浮，已打开独立小窗')}}catch(error){setStatus(error.message||'无法打开悬浮窗','error')}}
    $('#composer').onsubmit=submitTask;$('#taskList').onclick=taskAction;$('#editForm').onsubmit=saveEdit;$('#closeEdit').onclick=$('#cancelEdit').onclick=()=>$('#editDialog').close();$('#floatTodo').onclick=floatTodo;$('#filters').onclick=event=>{const value=event.target.dataset.filter;if(!value)return;filter=value;document.querySelectorAll('#filters button').forEach(button=>button.classList.toggle('active',button.dataset.filter===filter));render()};$('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};channel&&(channel.onmessage=()=>refresh(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true)});refresh();refreshTimer=setInterval(()=>refresh(true),15000);window.addEventListener('beforeunload',()=>{clearInterval(refreshTimer);channel?.close()});
  </script>
</body>
</html>
