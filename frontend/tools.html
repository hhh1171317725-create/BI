<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>报表工具中心</title>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--good:#12805c;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:var(--blue);color:#fff;font-weight:700}h1{margin:0;font-size:22px}header p,.note{color:var(--muted)}header p{margin:7px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button{line-height:normal}.nav a:hover,.nav button:hover{border-color:var(--blue);background:#eaf3ff}.panel{margin:18px 32px;padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:7px;color:#475467;font-weight:600}input,select{height:36px;min-width:150px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;font:inherit}input[type=search]{width:230px}button.primary{height:36px;padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}button.primary:disabled{opacity:.5;cursor:not-allowed}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid #edf1f5}.tools button{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;font:600 13px inherit;cursor:pointer}.tools button:hover{border-color:var(--blue);background:#eaf3ff}.status{min-height:20px;margin:12px 0 0}.status.error{color:var(--bad)}.status.ok{color:var(--good)}.hidden{display:none}.chart{height:310px}.table-wrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid #edf1f5;text-align:right}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f2f6fa;color:#344054;font-size:12px}.preview-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}.preview-head h2{margin:0;font-size:16px}.summary{margin-top:7px;color:var(--muted);font-size:12px}@media(max-width:950px){header,.panel{margin-left:16px;margin-right:16px;padding-left:16px;padding-right:16px}.header-row{align-items:flex-start}.filters label,input,select,input[type=search]{width:100%}.chart{height:280px}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">工</span><h1>报表工具中心</h1></div><p>按当前筛选预览、导出报表与下载趋势图。</p></div><nav class="nav"><a href="/">大航海日报</a><a href="/jd">京东日报</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main>
    <section class="panel"><div class="filters"><label>报表<select id="reportType"><option value="dhh">大航海日报</option><option value="jd">京东 CPA 日报</option></select></label><label>汇总维度<select id="dimension"></select></label><label>开始日期<input id="start" type="date" /></label><label>结束日期<input id="end" type="date" /></label><label>账户 ID（可选）<input id="accountId" type="search" inputmode="numeric" placeholder="输入完整账户 ID" /></label><label class="hidden" id="unknownWrap">未知优化师<select id="excludeUnknown"><option value="true">排除</option><option value="false">保留</option></select></label><button class="primary" id="query" type="button">查询并预览</button></div><div class="tools"><button id="export" type="button">下载当前 CSV</button><button id="chartDownload" type="button">下载趋势 PNG</button><button id="reset" type="button">重置筛选</button><button id="dictionary" type="button">下载数据字典</button></div><p class="status" id="status">请选择条件后查询。</p></section>
    <section class="panel hidden" id="result"><div class="preview-head"><div><h2 id="title">报表预览</h2><div class="summary" id="summary"></div></div></div><div class="chart" id="chart"></div><div class="table-wrap"><table id="table"></table></div></section>
  </main>
  <script src="/echarts.min.js"></script>
  <script>
    const $=selector=>document.querySelector(selector);
    const dimensionConfig={dhh:{by_optimizer:{label:'优化师',key:'优化师'},by_project:{label:'项目',key:'项目'},by_date:{label:'日期',key:'日期'},by_task:{label:'任务',key:'任务名'}},jd:{by_optimizer:{label:'优化师',key:'优化师'},by_date:{label:'日期',key:'日期'},by_media:{label:'媒体',key:'媒体'},by_account:{label:'媒体账户',key:'媒体账户名称'},by_promoter:{label:'推客',key:'推客用户名'}}};
    const dhhMetrics=['消耗','现金消耗','预估佣金','现金利润','ROI','现金ROI','结算数','结算单价','转化数','注册数','转化成本','注册成本'];
    const jdMetrics=['消耗','转化数','计费转化数','有效订单数','有效首购率','转化成本','条件内预估赔付金额','预估佣金合计','预估利润','预估ROI','实际佣金合计','实际利润','实际ROI','去重订单总数','首购订单总数','回流订单总数','首购有效订单数','回流有效订单数','首购已完成订单','回流已完成订单'];
    let report=null,chart=null;
    const number=value=>Number.isFinite(Number(value))?Number(value):0;
    const fmt=value=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(number(value));
    const pct=value=>(number(value)).toLocaleString('zh-CN',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2});
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    function beijingDateOffset(days){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(part=>part.type!=='literal').map(part=>[part.type,Number(part.value)]));return new Date(Date.UTC(parts.year,parts.month-1,parts.day+days)).toISOString().slice(0,10)}
    const defaultEnd=beijingDateOffset(-1),defaultStart=`${defaultEnd.slice(0,8)}01`;
    function setStatus(message,tone=''){const status=$('#status');status.textContent=message;status.className=`status ${tone}`}
    function updateDimensions(){const type=$('#reportType').value,entries=Object.entries(dimensionConfig[type]);$('#dimension').replaceChildren(...entries.map(([value,config])=>new Option(config.label,value)));$('#unknownWrap').classList.toggle('hidden',type!=='jd')}
    async function post(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(response.status===401){location.replace('/login');throw Error('登录已失效')}const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    function requestBody(){const type=$('#reportType').value,base={start:$('#start').value,end:$('#end').value,accountId:$('#accountId').value.trim()};return type==='jd'?{url:'/api/jd/analyze',body:{...base,excludeUnknownOptimizer:$('#excludeUnknown').value==='true'}}:{url:'/api/analyze',body:base}}
    function currentRows(){const type=$('#reportType').value,dimension=$('#dimension').value;return{type,dimension,config:dimensionConfig[type][dimension],rows:Array.isArray(report?.[dimension])?report[dimension]:[]}}
    function columnsFor(type,config){return type==='jd'?(config.key==='媒体账户名称'?[config.key,'媒体账户ID',...jdMetrics]:[config.key,...jdMetrics]):[config.key,...dhhMetrics]}
    function render(){const {type,dimension,config,rows}=currentRows(),columns=columnsFor(type,config),range=report.range||['-','-'];$('#result').classList.remove('hidden');$('#title').textContent=`${type==='jd'?'京东 CPA':'大航海'} · ${config.label}汇总`;$('#summary').textContent=`数据范围：${range[0]} 至 ${range[1]}，共 ${rows.length} 条。`;$('#table').innerHTML='<thead><tr>'+columns.map(column=>`<th>${esc(column)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(row=>'<tr>'+columns.map(column=>`<td>${column===config.key||column==='日期'?esc(row[column]):(column.includes('ROI')||column.includes('率')?pct(row[column]):fmt(row[column]))}</td>`).join('')+'</tr>').join('')+'</tbody>';const dates=[...(report.by_date||[])].sort((a,b)=>String(a.日期).localeCompare(String(b.日期)));chart=chart||echarts.init($('#chart'));chart.setOption({grid:{left:60,right:32,top:36,bottom:60},title:{text:'每日消耗趋势',left:12,top:6,textStyle:{fontSize:14}},tooltip:{trigger:'axis'},xAxis:{type:'category',data:dates.map(row=>row.日期),axisLabel:{rotate:35}},yAxis:{type:'value',name:'消耗'},dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:8}],series:[{type:'line',smooth:true,symbolSize:6,data:dates.map(row=>number(row.消耗)),lineStyle:{color:'#1677ff',width:3},itemStyle:{color:'#1677ff'}}]},{notMerge:true});requestAnimationFrame(()=>chart.resize())}
    async function query(){const start=$('#start').value,end=$('#end').value;if(start&&end&&start>end){setStatus('开始日期不能晚于结束日期。','error');return}const button=$('#query');try{button.disabled=true;button.textContent='查询中...';setStatus('正在读取报表数据...');const request=requestBody();report=await post(request.url,request.body);render();setStatus('查询完成。','ok')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false;button.textContent='查询并预览'}}
    function downloadCsv(){if(!report){setStatus('请先查询报表。','error');return}const {type,config,rows}=currentRows(),columns=columnsFor(type,config),cell=value=>{let text=String(value??'');if(/^[=+\-@]/.test(text))text=`'${text}`;return`"${text.replaceAll('"','""')}"`},csv='\ufeff'+[columns,...rows.map(row=>columns.map(column=>row[column]))].map(row=>row.map(cell).join(',')).join('\r\n'),link=document.createElement('a'),range=report.range||['全部','全部'];link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download=`${type==='jd'?'京东CPA':'大航海'}_${config.label}_${range[0]}_${range[1]}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),0);setStatus(`已导出 ${rows.length} 条数据。`,'ok')}
    function downloadChart(){if(!chart){setStatus('请先查询报表。','error');return}const link=document.createElement('a');link.href=chart.getDataURL({type:'png',pixelRatio:2,backgroundColor:'#fff'});link.download='报表每日消耗趋势.png';link.click();setStatus('趋势图 PNG 已下载。','ok')}
    function reset(){ $('#start').value=defaultStart;$('#end').value=defaultEnd;$('#accountId').value='';$('#excludeUnknown').value='true';report=null;$('#result').classList.add('hidden');setStatus('筛选已重置。') }
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    $('#reportType').onchange=updateDimensions;$('#dimension').onchange=()=>{if(report)render()};$('#query').onclick=query;$('#export').onclick=downloadCsv;$('#chartDownload').onclick=downloadChart;$('#reset').onclick=reset;$('#dictionary').onclick=()=>location.assign('/api/tools/data-dictionary');window.addEventListener('resize',()=>chart?.resize());$('#start').value=defaultStart;$('#end').value=defaultEnd;updateDimensions();
  </script>
</body>
</html>
