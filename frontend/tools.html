<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html:not(.authenticated) body{visibility:hidden}</style>
  <script>fetch('/api/session',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error();document.documentElement.classList.add('authenticated')}).catch(()=>location.replace('/login'));</script>
  <title>工具中心</title>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:var(--blue);color:#fff;font-weight:700}h1{margin:0;font-size:22px}header p{margin:7px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.secondary{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button,.secondary{line-height:normal}.nav a:hover,.nav button:hover,.secondary:hover{border-color:var(--blue);background:#eaf3ff}.section{margin:18px 32px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.section-head h2{margin:0;font-size:16px}.primary{height:36px;padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}.primary:hover{background:#0958d9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}#customTools{display:contents}.tool{min-height:148px;padding:16px;border:1px solid var(--line);border-radius:7px;background:#fff;display:flex;flex-direction:column;align-items:flex-start}.tool h3{margin:0;font-size:15px}.tool p{margin:8px 0 14px;color:var(--muted);line-height:1.55}.tool .actions{display:flex;gap:8px;margin-top:auto}.tool .actions a,.tool .actions button{height:30px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;font:600 12px inherit;line-height:28px;text-decoration:none;cursor:pointer}.tool .actions a:hover,.tool .actions button:hover{border-color:var(--blue);background:#eaf3ff}.tool .actions .delete{color:#b42318}.empty{padding:20px;border:1px dashed #c7d3df;border-radius:7px;color:var(--muted);background:#fff}dialog{width:min(460px,calc(100vw - 32px));border:1px solid var(--line);border-radius:8px;padding:0;box-shadow:0 20px 60px rgba(23,43,77,.25)}dialog::backdrop{background:rgba(23,43,77,.35)}.dialog-body{padding:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:17px}.close{width:30px;height:30px;padding:0;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.form{display:grid;gap:12px;margin-top:16px}label{display:grid;gap:7px;color:#475467;font-weight:600}input{height:36px;width:100%;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:950px){header,.section{margin-left:16px;margin-right:16px}.header-row{align-items:flex-start}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">工</span><h1>工具中心</h1></div><p>管理和打开你的常用工具。</p></div><nav class="nav"><a href="/">大航海日报</a><a href="/jd">京东日报</a><a href="/account">账户设置</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main><section class="section"><div class="section-head"><h2>我的工具</h2><button class="primary" id="addTool" type="button">添加工具</button></div><div class="grid"><article class="tool"><h3>聊天室</h3><p>在已登录设备之间传输文本、图片和文件。</p><div class="actions"><a href="/chat">打开</a></div></article><article class="tool"><h3>京东深链生成</h3><p>输入 lp_url，按默认渠道参数请求并获取京东深链。</p><div class="actions"><a href="/deeplink">打开</a></div></article><div id="customTools"></div></div><div class="empty" id="emptyTools">还没有自定义工具。点击“添加工具”创建你的第一个常用入口。</div></section></main>
  <dialog id="toolDialog"><form class="dialog-body" id="toolForm" method="dialog"><div class="dialog-head"><h2>添加工具</h2><button class="close" id="closeDialog" type="button" aria-label="关闭">×</button></div><div class="form"><label>工具名称<input id="toolName" required maxlength="40" placeholder="例如：素材库" /></label><label>工具链接<input id="toolUrl" required maxlength="500" placeholder="https://example.com 或 /jd" /></label><label>说明（可选）<input id="toolDescription" maxlength="100" placeholder="例如：查看素材与下载文件" /></label></div><div class="dialog-actions"><button class="secondary" id="cancelDialog" type="button">取消</button><button class="primary" type="submit">添加</button></div></form></dialog>
  <script>
    const $=selector=>document.querySelector(selector),storageKey='marketing-report-custom-tools-v1';
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    function readTools(){try{const tools=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(tools)?tools:[]}catch{return[]}}
    function writeTools(tools){localStorage.setItem(storageKey,JSON.stringify(tools))}
    function safeUrl(value){try{const url=new URL(value,location.origin);return ['http:','https:'].includes(url.protocol)&&((url.origin===location.origin&&value.startsWith('/'))||url.protocol==='https:'||url.protocol==='http:')?url.href:''}catch{return''}}
    function renderTools(){const tools=readTools(),target=$('#customTools');target.innerHTML=tools.map((tool,index)=>`<article class="tool"><h3>${esc(tool.name)}</h3><p>${esc(tool.description||tool.url)}</p><div class="actions"><a href="${esc(tool.url)}" target="_blank" rel="noopener">打开</a><button class="delete" type="button" data-delete="${index}">删除</button></div></article>`).join('');$('#emptyTools').classList.toggle('hidden',tools.length>0)}
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    $('#addTool').onclick=()=>$('#toolDialog').showModal();$('#closeDialog').onclick=$('#cancelDialog').onclick=()=>$('#toolDialog').close();$('#toolForm').onsubmit=event=>{event.preventDefault();const url=safeUrl($('#toolUrl').value.trim());if(!url){alert('请输入有效的 http、https 或本站相对路径链接。');return}const tools=readTools();tools.push({name:$('#toolName').value.trim(),url,description:$('#toolDescription').value.trim()});writeTools(tools);event.target.reset();$('#toolDialog').close();renderTools()};$('#customTools').onclick=event=>{const index=event.target.dataset.delete;if(index===undefined)return;const tools=readTools();tools.splice(Number(index),1);writeTools(tools);renderTools()};renderTools();
  </script>
</body>
</html>
