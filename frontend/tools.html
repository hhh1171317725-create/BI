<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具中心</title>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--good:#12805c;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:7px;background:var(--blue);color:#fff;font-weight:700}h1{margin:0;font-size:22px}header p,.note{color:var(--muted)}header p{margin:7px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.secondary{height:34px;padding:0 12px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;text-decoration:none;font:600 13px inherit;line-height:32px;cursor:pointer}.nav button,.secondary{line-height:normal}.nav a:hover,.nav button:hover,.secondary:hover{border-color:var(--blue);background:#eaf3ff}.section{margin:18px 32px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.section-head h2{margin:0;font-size:16px}.primary{height:36px;padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}.primary:hover{background:#0958d9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.tool{min-height:148px;padding:16px;border:1px solid var(--line);border-radius:7px;background:#fff;display:flex;flex-direction:column;align-items:flex-start}.tool h3{margin:0;font-size:15px}.tool p{margin:8px 0 14px;color:var(--muted);line-height:1.55}.tool .actions{display:flex;gap:8px;margin-top:auto}.tool .actions a,.tool .actions button{height:30px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;color:#1756a9;font:600 12px inherit;line-height:28px;text-decoration:none;cursor:pointer}.tool .actions a:hover,.tool .actions button:hover{border-color:var(--blue);background:#eaf3ff}.tool .actions .delete{color:#b42318}.empty{padding:20px;border:1px dashed #c7d3df;border-radius:7px;color:var(--muted);background:#fff}.panel{margin:18px 32px;padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:7px;color:#475467;font-weight:600}input,select{height:36px;min-width:150px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;background:#fff;font:inherit}input[type=search]{width:230px}.hidden{display:none}.status{min-height:20px;margin:12px 0 0;color:var(--muted)}.status.error{color:var(--bad)}.status.ok{color:var(--good)}dialog{width:min(460px,calc(100vw - 32px));border:1px solid var(--line);border-radius:8px;padding:0;box-shadow:0 20px 60px rgba(23,43,77,.25)}dialog::backdrop{background:rgba(23,43,77,.35)}.dialog-body{padding:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:17px}.close{width:30px;height:30px;padding:0;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.form{display:grid;gap:12px;margin-top:16px}.form input{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:950px){header,.section,.panel{margin-left:16px;margin-right:16px}.header-row{align-items:flex-start}.filters label,input,select,input[type=search]{width:100%}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><div class="brand"><span class="mark">工</span><h1>工具中心</h1></div><p>集中打开报表、下载资料与管理常用工具。</p></div><nav class="nav"><a href="/">大航海日报</a><a href="/jd">京东日报</a><button id="logout" type="button">退出登录</button></nav></div></header>
  <main>
    <section class="section"><div class="section-head"><h2>内置工具</h2></div><div class="grid"><article class="tool"><h3>大航海日报</h3><p>查看优化师、项目、任务与日期维度分析。</p><div class="actions"><a href="/">打开报表</a></div></article><article class="tool"><h3>京东 CPA 日报</h3><p>查看优化师、媒体账户、推客与订单指标。</p><div class="actions"><a href="/jd">打开报表</a></div></article><article class="tool"><h3>数据导出</h3><p>按日期、账户和汇总维度下载当前报表 CSV。</p><div class="actions"><button id="openExport" type="button">使用工具</button></div></article><article class="tool"><h3>数据字典</h3><p>下载大航海和京东字段口径说明。</p><div class="actions"><button id="dictionary" type="button">下载</button></div></article><article class="tool"><h3>接口检查脚本</h3><p>下载 Windows PowerShell 接口回归检查脚本。</p><div class="actions"><button id="apiScript" type="button">下载</button></div></article></div></section>
    <section class="section"><div class="section-head"><h2>我的工具</h2><button class="primary" id="addTool" type="button">添加工具</button></div><div class="grid" id="customTools"></div><div class="empty" id="emptyTools">还没有自定义工具。添加常用网站、表格或内部系统链接。</div></section>
    <section class="panel hidden" id="exportPanel"><div class="section-head"><h2>数据导出</h2><button class="secondary" id="closeExport" type="button">收起</button></div><div class="filters"><label>报表<select id="reportType"><option value="dhh">大航海日报</option><option value="jd">京东 CPA 日报</option></select></label><label>汇总维度<select id="dimension"></select></label><label>开始日期<input id="start" type="date" /></label><label>结束日期<input id="end" type="date" /></label><label>账户 ID（可选）<input id="accountId" type="search" inputmode="numeric" placeholder="输入完整账户 ID" /></label><label class="hidden" id="unknownWrap">未知优化师<select id="excludeUnknown"><option value="true">排除</option><option value="false">保留</option></select></label><button class="primary" id="export" type="button">生成并下载 CSV</button></div><p class="status" id="status"></p></section>
  </main>
  <dialog id="toolDialog"><form class="dialog-body" id="toolForm" method="dialog"><div class="dialog-head"><h2>添加工具</h2><button class="close" id="closeDialog" type="button" aria-label="关闭">×</button></div><div class="form"><label>工具名称<input id="toolName" required maxlength="40" placeholder="例如：素材库" /></label><label>工具链接<input id="toolUrl" required maxlength="500" placeholder="https://example.com 或 /jd" /></label><label>说明（可选）<input id="toolDescription" maxlength="100" placeholder="例如：查看素材与下载文件" /></label></div><div class="dialog-actions"><button class="secondary" id="cancelDialog" type="button">取消</button><button class="primary" type="submit">添加</button></div></form></dialog>
  <script>
    const $=selector=>document.querySelector(selector),storageKey='marketing-report-custom-tools-v1';
    const dimensions={dhh:{by_optimizer:{label:'优化师',key:'优化师'},by_project:{label:'项目',key:'项目'},by_date:{label:'日期',key:'日期'},by_task:{label:'任务',key:'任务名'}},jd:{by_optimizer:{label:'优化师',key:'优化师'},by_date:{label:'日期',key:'日期'},by_media:{label:'媒体',key:'媒体'},by_account:{label:'媒体账户',key:'媒体账户名称'},by_promoter:{label:'推客',key:'推客用户名'}}};
    const dhhMetrics=['消耗','现金消耗','预估佣金','现金利润','ROI','现金ROI','结算数','结算单价','转化数','注册数','转化成本','注册成本'];
    const jdMetrics=['消耗','转化数','计费转化数','有效订单数','有效首购率','转化成本','条件内预估赔付金额','预估佣金合计','预估利润','预估ROI','实际佣金合计','实际利润','实际ROI','去重订单总数','首购订单总数','回流订单总数','首购有效订单数','回流有效订单数','首购已完成订单','回流已完成订单'];
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    function readTools(){try{const tools=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(tools)?tools:[]}catch{return[]}}
    function writeTools(tools){localStorage.setItem(storageKey,JSON.stringify(tools))}
    function safeUrl(value){try{const url=new URL(value,location.origin);return ['http:','https:'].includes(url.protocol)&&((url.origin===location.origin&&value.startsWith('/'))||url.protocol==='https:'||url.protocol==='http:')?url.href:''}catch{return''}}
    function renderTools(){const tools=readTools(),target=$('#customTools');target.innerHTML=tools.map((tool,index)=>`<article class="tool"><h3>${esc(tool.name)}</h3><p>${esc(tool.description||tool.url)}</p><div class="actions"><a href="${esc(tool.url)}" target="_blank" rel="noopener">打开</a><button class="delete" type="button" data-delete="${index}">删除</button></div></article>`).join('');$('#emptyTools').classList.toggle('hidden',tools.length>0)}
    function setStatus(message,tone=''){const status=$('#status');status.textContent=message;status.className=`status ${tone}`}
    function beijingDateOffset(days){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(part=>part.type!=='literal').map(part=>[part.type,Number(part.value)]));return new Date(Date.UTC(parts.year,parts.month-1,parts.day+days)).toISOString().slice(0,10)}
    const defaultEnd=beijingDateOffset(-1),defaultStart=`${defaultEnd.slice(0,8)}01`;
    function updateDimensions(){const type=$('#reportType').value;$('#dimension').replaceChildren(...Object.entries(dimensions[type]).map(([value,item])=>new Option(item.label,value)));$('#unknownWrap').classList.toggle('hidden',type!=='jd')}
    async function post(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(response.status===401){location.replace('/login');throw Error('登录已失效')}const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    function downloadCsv(filename,columns,rows){const cell=value=>{let text=String(value??'');if(/^[=+\-@]/.test(text))text=`'${text}`;return`"${text.replaceAll('"','""')}"`};const csv='\ufeff'+[columns,...rows.map(row=>columns.map(column=>row[column]))].map(row=>row.map(cell).join(',')).join('\r\n'),link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),0)}
    async function exportReport(){const start=$('#start').value,end=$('#end').value;if(start&&end&&start>end){setStatus('开始日期不能晚于结束日期。','error');return}const type=$('#reportType').value,dimension=$('#dimension').value,config=dimensions[type][dimension],button=$('#export');try{button.disabled=true;button.textContent='生成中...';setStatus('正在读取报表数据...');const body={start,end,accountId:$('#accountId').value.trim()};const report=await post(type==='jd'?'/api/jd/analyze':'/api/analyze',type==='jd'?{...body,excludeUnknownOptimizer:$('#excludeUnknown').value==='true'}:body);const columns=type==='jd'?(config.key==='媒体账户名称'?[config.key,'媒体账户ID',...jdMetrics]:[config.key,...jdMetrics]):[config.key,...dhhMetrics],rows=Array.isArray(report[dimension])?report[dimension]:[],range=report.range||['全部','全部'];downloadCsv(`${type==='jd'?'京东CPA':'大航海'}_${config.label}_${range[0]}_${range[1]}.csv`,columns,rows);setStatus(`已导出 ${rows.length} 条${config.label}汇总数据。`,'ok')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false;button.textContent='生成并下载 CSV'}}
    $('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login')}};
    $('#openExport').onclick=()=>{$('#exportPanel').classList.remove('hidden');$('#exportPanel').scrollIntoView({behavior:'smooth',block:'start'})};$('#closeExport').onclick=()=>$('#exportPanel').classList.add('hidden');$('#dictionary').onclick=()=>location.assign('/api/tools/data-dictionary');$('#apiScript').onclick=()=>location.assign('/api/tools/api-check-script');$('#reportType').onchange=updateDimensions;$('#export').onclick=exportReport;$('#addTool').onclick=()=>$('#toolDialog').showModal();$('#closeDialog').onclick=$('#cancelDialog').onclick=()=>$('#toolDialog').close();$('#toolForm').onsubmit=event=>{event.preventDefault();const url=safeUrl($('#toolUrl').value.trim());if(!url){alert('请输入有效的 http、https 或本站相对路径链接。');return}const tools=readTools();tools.push({name:$('#toolName').value.trim(),url,description:$('#toolDescription').value.trim()});writeTools(tools);event.target.reset();$('#toolDialog').close();renderTools()};$('#customTools').onclick=event=>{const index=event.target.dataset.delete;if(index===undefined)return;const tools=readTools();tools.splice(Number(index),1);writeTools(tools);renderTools()};$('#start').value=defaultStart;$('#end').value=defaultEnd;updateDimensions();renderTools();
  </script>
</body>
</html>
