<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大航海日报分析</title>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--good:#12805c;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}header p,.note{color:var(--muted)}header p{margin:7px 0 0}.panel,.content{margin:18px 32px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.controls,.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:7px;color:#475467;font-weight:600}input{width:390px;height:36px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;font:inherit}input[type=date]{width:155px}button{height:36px;padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}button.secondary{color:#1756a9;background:#eaf3ff}button:disabled{opacity:.5;cursor:not-allowed}.note{margin:0;font-size:12px}.hidden{display:none}.cards{margin:18px 32px;display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px}.card{min-height:88px;padding:14px;border:1px solid var(--line);border-radius:7px;background:#fff}.card .k{color:var(--muted);font-size:12px}.card .v{margin-top:10px;font-size:20px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}.tabs{margin:18px 32px 0;display:flex;gap:4px;border-bottom:1px solid var(--line)}.tab{border-radius:5px 5px 0 0;background:transparent;color:var(--muted)}.tab.active{background:#eaf3ff;color:var(--blue)}.content{margin-top:0;border-top:0;border-radius:0 0 8px 8px;padding:0;overflow:hidden}.insight{padding:16px 18px 5px;color:#475467}.chart{width:100%;height:290px}.table-wrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid #edf1f5;text-align:right}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f2f6fa;color:#344054;font-size:12px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 14px;color:var(--muted)}.pager button{height:30px;padding:0 11px;font-size:12px}@media(max-width:950px){header,.panel,.cards,.tabs,.content{margin-left:16px;margin-right:16px}.cards{grid-template-columns:repeat(2,1fr)}input{width:100%}}
  </style>
</head>
<body>
  <header><h1>大航海日报分析</h1><p>全量导出后，按优化师、项目、日期和任务归因汇总。利润口径：预估佣金 - 现金消耗。</p></header>
  <section class="panel"><div class="controls"><label>x-token<input id="token" type="password" autocomplete="off" placeholder="粘贴当前 x-token，仅用于本次加载" /></label><label>用户 ID<input id="userId" value="20" inputmode="numeric" /></label><button id="load">加载全量数据</button><span class="note" id="status">Token 不会保存到服务器或文件。</span></div></section>
  <section class="panel hidden" id="filterPanel"><div class="filters"><label>开始日期（可选）<input id="start" type="date" /></label><label>结束日期（可选）<input id="end" type="date" /></label><button class="secondary" id="apply">应用日期筛选</button><span class="note" id="loading"></span></div></section>
  <section class="cards hidden" id="cards"></section>
  <nav class="tabs hidden" id="tabs"><button class="tab active" data-key="by_optimizer">优化师</button><button class="tab" data-key="by_project">项目</button><button class="tab" data-key="by_date">时间</button><button class="tab" data-key="by_task">任务</button></nav>
  <main class="content hidden" id="content"><div class="insight" id="insight"></div><div class="chart" id="chart"></div><div class="table-wrap"><table id="table"></table></div><div class="pager" id="pager"></div></main>
  <script src="/echarts.min.js"></script>
  <script>
    let data=null,active='by_optimizer',page=1,chart;const pageSize=20;
    const names={by_optimizer:'优化师',by_project:'项目',by_date:'日期',by_task:'任务名'};
    const fmt=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(n||0);const pct=n=>(n||0).toLocaleString('zh-CN',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2});
    async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await r.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用，请确认已拉取最新代码并重启服务')}if(!r.ok)throw Error(result.error||'请求失败');return result}
    function renderCards(){const s=data.summary,items=[['明细行',data.rows],['消耗',s.消耗],['现金消耗',s.现金消耗],['预估佣金',s.预估佣金],['现金利润',s.现金利润],['现金ROI',pct(s.现金ROI)]];cards.innerHTML=items.map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v ${k==='现金利润'?(v<0?'bad':'good'):''}">${typeof v==='number'?fmt(v):v}</div></div>`).join('')}
    function render(){const rows=data[active]||[],key=names[active],pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);const shown=rows.slice((page-1)*pageSize,page*pageSize);insight.textContent=`数据范围：${data.range[0]} 至 ${data.range[1]}，当前按${key}汇总。`;const cols=[key,'消耗','现金消耗','预估佣金','现金利润','ROI','现金ROI','结算数','结算单价','转化数','注册数','转化成本','注册成本'];table.innerHTML='<thead><tr>'+cols.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+shown.map(r=>'<tr>'+cols.map(c=>`<td class="${c==='现金利润'?(r[c]<0?'bad':'good'):''}">${c==='ROI'||c==='现金ROI'?pct(r[c]):c===key?r[c]:fmt(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody>';pager.innerHTML=`<span>共 ${rows.length} 条，第 ${page}/${pages} 页</span><button data-step="-1" ${page===1?'disabled':''}>上一页</button><button data-step="1" ${page===pages?'disabled':''}>下一页</button>`;draw(rows)}
    function draw(rows){if(active!=='by_date'){chartEl.classList.add('hidden');return}chartEl.classList.remove('hidden');chart=chart||echarts.init(chartEl);const ordered=[...rows].reverse();chart.setOption({grid:{left:60,right:30,top:42,bottom:58},title:{text:'每日消耗趋势',left:16,top:8,textStyle:{fontSize:14}},tooltip:{trigger:'axis',formatter:p=>{const r=ordered[p[0].dataIndex];return `${r.日期}<br>消耗：${fmt(r.消耗)}<br>现金ROI：${pct(r.现金ROI)}`}},xAxis:{type:'category',data:ordered.map(x=>x.日期),axisLabel:{rotate:35}},yAxis:{type:'value',name:'消耗'},dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:8}],series:[{type:'line',data:ordered.map(x=>x.消耗),smooth:true,lineStyle:{color:'#1677ff',width:3},itemStyle:{color:'#1677ff'}}]},{notMerge:true})}
    async function load(){const token=tokenInput.value.trim();if(!token){alert('请粘贴当前 x-token');return}try{loadButton.disabled=true;loadButton.textContent='加载中...';status.textContent='正在获取全量报表...';data=await post('/api/load',{token,userId:userIdInput.value.trim()||'20'});tokenInput.value='';filterPanel.classList.remove('hidden');cards.classList.remove('hidden');tabs.classList.remove('hidden');content.classList.remove('hidden');renderCards();render();status.textContent='数据已加载。Token 未保存。'}catch(e){status.textContent=e.message;alert(e.message)}finally{loadButton.disabled=false;loadButton.textContent='加载全量数据'}}
    const tokenInput=document.querySelector('#token'),userIdInput=document.querySelector('#userId'),loadButton=document.querySelector('#load'),status=document.querySelector('#status'),filterPanel=document.querySelector('#filterPanel'),cards=document.querySelector('#cards'),tabs=document.querySelector('#tabs'),content=document.querySelector('#content'),insight=document.querySelector('#insight'),table=document.querySelector('#table'),pager=document.querySelector('#pager'),chartEl=document.querySelector('#chart');loadButton.onclick=load;document.querySelector('#apply').onclick=async()=>{try{loading.textContent='计算中...';data=await post('/api/analyze',{start:start.value,end:end.value});page=1;renderCards();render()}finally{loading.textContent=''}};tabs.onclick=e=>{if(!e.target.dataset.key)return;active=e.target.dataset.key;page=1;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===e.target));render()};pager.onclick=e=>{if(!e.target.dataset.step)return;page+=Number(e.target.dataset.step);render()};window.addEventListener('resize',()=>chart?.resize());
  </script>
</body>
</html>
