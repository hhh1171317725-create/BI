<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大航海日报分析</title>
  <style>
    :root{--blue:#1677ff;--ink:#172b4d;--muted:#667085;--line:#d9e2ec;--bg:#f5f8fb;--good:#12805c;--bad:#cf3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",sans-serif}header{padding:20px 32px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.report-link{flex:none;padding:8px 12px;border:1px solid #c7d3df;border-radius:5px;color:#1756a9;text-decoration:none;font-weight:600}.report-link:hover,.report-link:focus-visible{border-color:var(--blue);background:#eaf3ff;outline:none}h1{margin:0;font-size:22px}header p,.note{color:var(--muted)}header p{margin:7px 0 0}.panel,.content{margin:18px 32px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.controls,.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:7px;color:#475467;font-weight:600}input,select{height:36px;padding:0 10px;border:1px solid #c7d3df;border-radius:5px;font:inherit}input{width:390px}input[type=date]{width:155px}select{min-width:260px}button{height:36px;padding:0 16px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:600 14px inherit;cursor:pointer}button.secondary{color:#1756a9;background:#eaf3ff}button:disabled{opacity:.5;cursor:not-allowed}.note{margin:10px 0 0;font-size:12px}.chart-heading{margin:20px 16px 0;font-size:14px;font-weight:600;line-height:20px;color:var(--ink)}.hidden{display:none}.cards{margin:18px 32px;display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px}.card{min-height:88px;padding:14px;border:1px solid var(--line);border-radius:7px;background:#fff}.card .k{color:var(--muted);font-size:12px}.card .v{margin-top:10px;font-size:20px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}.tabs{margin:18px 32px 0;display:flex;gap:4px;border-bottom:1px solid var(--line)}.tab{border-radius:5px 5px 0 0;background:transparent;color:var(--muted)}.tab.active{background:#eaf3ff;color:var(--blue)}.content{margin-top:0;border-top:0;border-radius:0 0 8px 8px;padding:0;overflow:hidden}.insight{padding:16px 18px 5px;color:#475467}.chart{width:100%;height:270px}.table-wrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid #edf1f5;text-align:right}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f2f6fa;color:#344054;font-size:12px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 14px;color:var(--muted)}.pager button{height:30px;padding:0 11px;font-size:12px}@media(max-width:950px){header,.panel,.cards,.tabs,.content{margin-left:16px;margin-right:16px}.header-row{align-items:flex-start}.cards{grid-template-columns:repeat(2,1fr)}input,select{width:100%}}
  </style>
  <style>
    .alert-panel{margin:18px 32px;padding:16px 18px;border:1px solid #f5c2c0;border-radius:8px;background:#fff4f3}
    .alert-panel.ok{border-color:#a9dec9;background:#f0fbf7}.alert-panel.no-data{border-color:#d9e2ec;background:#fff}
    .alert-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.alert-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.alert-title{margin:0;font-size:16px}.alert-badge{flex:none;padding:3px 9px;border-radius:999px;background:#cf3d3d;color:#fff;font-size:12px;font-weight:700}.alert-panel.ok .alert-badge{background:#12805c}.alert-panel.no-data .alert-badge{background:#667085}
    .alert-list{display:grid;gap:10px;margin-top:14px}.alert-item{position:relative;padding:12px 120px 12px 14px;border:1px solid #f0cfcd;border-radius:6px;background:#fff}.alert-account{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}.alert-account-id,.alert-task-tag{padding:2px 7px;border-radius:999px;background:#eef2f6;color:#475467;font-size:11px;font-weight:600}.alert-task{margin-top:6px;color:#344054;font-weight:600}.alert-task-tag{margin-left:7px;background:#fff0d5;color:#9a6700}.alert-metrics{margin:5px 0;color:#667085;font-size:12px}.alert-reasons{margin:6px 0 0;padding-left:20px;color:#b42318}.alert-reasons li+li{margin-top:4px}.alert-dismiss,.alert-restore{height:28px;padding:0 10px;border:1px solid #c7d3df;background:#fff;color:#475467;font-size:12px}.alert-dismiss{position:absolute;top:12px;right:14px}.alert-dismiss:hover,.alert-restore:hover{border-color:#98a2b3;background:#f2f4f7}
    @media(max-width:950px){.alert-panel{margin-left:16px;margin-right:16px}}@media(max-width:560px){.alert-head{display:block}.alert-head-actions{justify-content:flex-start;margin-top:8px}.alert-item{padding-right:14px}.alert-dismiss{position:static;margin-top:8px}}
  </style>
</head>
<body>
  <header><div class="header-row"><div><h1>大航海日报分析</h1><p>全量导出后，按优化师、项目、日期和任务归因汇总。利润口径：预估佣金 - 现金消耗。</p></div><a class="report-link" href="/jd">京东日报 →</a></div></header>
  <section class="panel"><div class="controls"><label>x-token<input id="token" type="password" autocomplete="off" placeholder="仅更新最新数据时需要粘贴" /></label><label>用户 ID<input id="userId" value="20" inputmode="numeric" /></label><button id="load">更新全量数据</button></div><p class="note" id="status">正在读取服务器缓存。Token 不会保存到服务器或文件。</p></section>
  <section class="panel hidden" id="filterPanel"><div class="filters"><label>开始日期（可选）<input id="start" type="date" /></label><label>结束日期（可选）<input id="end" type="date" /></label><button class="secondary" id="apply">应用日期筛选</button><span class="note" id="loading"></span></div></section>
  <section class="alert-panel hidden" id="alerts" aria-live="polite"></section>
  <section class="cards hidden" id="cards"></section>
  <nav class="tabs hidden" id="tabs"><button class="tab active" data-key="by_optimizer">优化师</button><button class="tab" data-key="by_project">项目</button><button class="tab" data-key="by_date">时间</button><button class="tab" data-key="by_task">任务</button></nav>
  <main class="content hidden" id="content"><div class="insight" id="insight"></div><div class="chart-heading hidden" id="chartTitle"></div><div class="chart" id="chart"></div><div class="table-wrap"><table id="table"></table></div><div class="pager" id="pager"></div></main>
  <section class="panel hidden" id="drillPanel"><div class="filters"><label id="drillLabel">关联对象<select id="drillSelect"></select></label><label class="hidden" id="taskFilter">任务<select id="taskSelect"></select></label></div><p class="note" id="drillNote"></p><div class="chart-heading" id="drillChartTitle"></div><div class="chart" id="drillChart"></div><div class="table-wrap"><table id="drillTable"></table></div><div class="pager" id="drillPager"></div></section>
  <script src="/echarts.min.js"></script>
  <script>
    let data=null,active='by_optimizer',page=1,drillPage=1,mainChart,detailChart;
    const pageSize=20;
    const names={by_optimizer:'优化师',by_project:'项目',by_date:'日期',by_task:'任务名'};
    const $=selector=>document.querySelector(selector);
    const fmt=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(n||0);
    const pct=n=>(n||0).toLocaleString('zh-CN',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2});
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    const dismissedAlertStorageKey='dhh-dismissed-alerts-v1';
    const alertId=(alerts,item)=>encodeURIComponent(JSON.stringify([alerts.date,item.账户ID||item.账户名称,item.任务名]));
    function dismissedAlertIds(){try{const ids=JSON.parse(localStorage.getItem(dismissedAlertStorageKey)||'[]');return new Set(Array.isArray(ids)?ids:[])}catch{return new Set()}}
    function saveDismissedAlertIds(ids){localStorage.setItem(dismissedAlertStorageKey,JSON.stringify([...ids]))}
    async function post(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用，请确认已拉取最新代码并重启服务')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    async function get(url){const response=await fetch(url);const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('服务端接口不可用，请确认已拉取最新代码并重启服务')}if(!response.ok)throw Error(result.error||'请求失败');return result}
    function cell(value,column,key){return column==='ROI'||column==='现金ROI'?pct(value):column===key||column==='日期'?value:fmt(value)}
    function dataTable(target,rows,columns,key){target.innerHTML='<thead><tr>'+columns.map(column=>`<th>${column}</th>`).join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+columns.map(column=>`<td class="${column==='现金利润'?(row[column]<0?'bad':'good'):''}">${cell(row[column],column,key)}</td>`).join('')+'</tr>').join('')+'</tbody>'}
    function pager(target,total,current){const pages=Math.max(1,Math.ceil(total/pageSize));target.innerHTML=`<span>共 ${total} 条，第 ${current}/${pages} 页</span><button data-step="-1" ${current===1?'disabled':''}>上一页</button><button data-step="1" ${current===pages?'disabled':''}>下一页</button>`}
    function summaryCards(){const s=data.summary,items=[['明细行',data.rows],['消耗',s.消耗],['现金消耗',s.现金消耗],['预估佣金',s.预估佣金],['现金利润',s.现金利润],['现金ROI',pct(s.现金ROI)]];$('#cards').innerHTML=items.map(([key,value])=>`<div class="card"><div class="k">${key}</div><div class="v ${key==='现金利润'?(value<0?'bad':'good'):''}">${typeof value==='number'?fmt(value):value}</div></div>`).join('')}
    function renderAlerts(){const panel=$('#alerts'),alerts=data.alerts;if(!alerts){panel.className='alert-panel hidden';return}panel.className='alert-panel';const title=`${esc(alerts.date)} 账户任务异常预警`;if(!alerts.hasData){panel.classList.add('no-data');panel.innerHTML=`<div class="alert-head"><h2 class="alert-title">${title}</h2><span class="alert-badge">无数据</span></div>`;return}if(!alerts.hasAccountData){panel.classList.add('no-data');panel.innerHTML=`<div class="alert-head"><h2 class="alert-title">${title}</h2><span class="alert-badge">请更新数据</span></div>`;return}if(!alerts.total){panel.classList.add('ok');panel.innerHTML=`<div class="alert-head"><h2 class="alert-title">${title}</h2><span class="alert-badge">正常</span></div>`;return}const dismissed=dismissedAlertIds(),visible=alerts.items.filter(item=>!dismissed.has(alertId(alerts,item))),dismissedCount=alerts.total-visible.length,restore=dismissedCount?`<button class="alert-restore" type="button" data-restore-alerts>恢复已取消（${fmt(dismissedCount)}）</button>`:'';if(!visible.length){panel.classList.add('no-data');panel.innerHTML=`<div class="alert-head"><h2 class="alert-title">${title}</h2><div class="alert-head-actions"><span class="alert-badge">已取消 ${fmt(dismissedCount)} 个</span>${restore}</div></div>`;return}panel.innerHTML=`<div class="alert-head"><h2 class="alert-title">${title}</h2><div class="alert-head-actions"><span class="alert-badge">${fmt(visible.length)} 个异常账户任务</span>${restore}</div></div><div class="alert-list">${visible.map(item=>`<article class="alert-item"><div class="alert-account"><span>${esc(item.账户名称)}</span>${item.账户ID?`<span class="alert-account-id">ID ${esc(item.账户ID)}</span>`:''}</div><div class="alert-task">任务：${esc(item.任务名)}${item.闲鱼任务?'<span class="alert-task-tag">闲鱼任务</span>':''}</div><div class="alert-metrics">账户消耗 ${fmt(item.消耗)} 元 · 关联注册数 ${fmt(item.关联注册数)} · 关联结算数 ${fmt(item.关联结算数)}</div><ul class="alert-reasons">${item.reasons.map(reason=>`<li>${esc(reason.message)}</li>`).join('')}</ul><button class="alert-dismiss" type="button" data-dismiss-alert="${alertId(alerts,item)}">取消预警</button></article>`).join('')}</div>`}
    function lineChart(element,chart,rows){const ordered=[...rows].reverse();const next=chart||echarts.init(element);next.setOption({grid:{left:60,right:30,top:28,bottom:58},tooltip:{trigger:'axis',formatter:params=>{const row=ordered[params[0].dataIndex];return `${row.日期}<br>消耗：${fmt(row.消耗)}<br>现金ROI：${pct(row.现金ROI)}`}},xAxis:{type:'category',data:ordered.map(row=>row.日期),axisLabel:{rotate:35}},yAxis:{type:'value',name:'消耗'},dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:8}],series:[{type:'line',data:ordered.map(row=>row.消耗),smooth:true,lineStyle:{color:'#1677ff',width:3},itemStyle:{color:'#1677ff'}}]},{notMerge:true});return next}
    function renderMain(){const rows=data[active]||[],key=names[active],pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);$('#insight').textContent=`数据范围：${data.range[0]} 至 ${data.range[1]}，当前按${key}汇总。`;const columns=[key,'消耗','现金消耗','预估佣金','现金利润','ROI','现金ROI','结算数','结算单价','转化数','注册数','转化成本','注册成本'];dataTable($('#table'),rows.slice((page-1)*pageSize,page*pageSize),columns,key);pager($('#pager'),rows.length,page);if(active==='by_date'){$('#chartTitle').textContent='每日消耗趋势';$('#chartTitle').classList.remove('hidden');$('#chart').classList.remove('hidden');mainChart=lineChart($('#chart'),mainChart,rows)}else{$('#chartTitle').classList.add('hidden');$('#chart').classList.add('hidden')}renderDetail()}
    function renderDetail(){const maps={by_optimizer:['优化师','by_optimizer_date'],by_project:['项目','by_project_date'],by_task:['任务名','by_task_date']},config=maps[active];if(!config){$('#drillPanel').classList.add('hidden');return}const [key,source]=config,choices=data[active]||[];if(!choices.length){$('#drillPanel').classList.add('hidden');return}$('#drillPanel').classList.remove('hidden');$('#drillLabel').childNodes[0].textContent=`${key}关联日期：`;const select=$('#drillSelect'),previous=select.value;select.innerHTML=choices.map(item=>`<option value="${item[key]}">${item[key]}</option>`).join('');select.value=choices.some(item=>item[key]===previous)?previous:choices[0][key];let rows=(data[source]||[]).filter(item=>item[key]===select.value),title=select.value,noteSuffix='';const taskFilter=$('#taskFilter'),taskSelect=$('#taskSelect');if(active==='by_optimizer'){taskFilter.classList.remove('hidden');const taskRows=(data.by_optimizer_task_date||[]).filter(item=>item.优化师===select.value),tasks=[...new Set(taskRows.map(item=>item.任务名))].sort((a,b)=>a.localeCompare(b,'zh-CN')),previousTask=taskSelect.value;taskSelect.innerHTML='<option value="">全部任务</option>'+tasks.map(task=>`<option value="${task}">${task}</option>`).join('');taskSelect.value=tasks.includes(previousTask)?previousTask:'';if(taskSelect.value){rows=taskRows.filter(item=>item.任务名===taskSelect.value);title=`${select.value} - ${taskSelect.value}`;noteSuffix=`，任务：${taskSelect.value}`}}else taskFilter.classList.add('hidden');rows.sort((a,b)=>b.日期.localeCompare(a.日期));const pages=Math.max(1,Math.ceil(rows.length/pageSize));drillPage=Math.min(drillPage,pages);$('#drillNote').textContent=`${select.value} 的关联日期数据${noteSuffix}，共 ${rows.length} 天，按日期降序。`;$('#drillChartTitle').textContent=`${title} 每日消耗趋势`;const columns=['日期','消耗','现金消耗','预估佣金','现金利润','ROI','现金ROI','结算数','结算单价','转化数','注册数','转化成本','注册成本'];dataTable($('#drillTable'),rows.slice((drillPage-1)*pageSize,drillPage*pageSize),columns,'日期');pager($('#drillPager'),rows.length,drillPage);detailChart=lineChart($('#drillChart'),detailChart,rows)}
    function showData(){ $('#filterPanel').classList.remove('hidden');$('#cards').classList.remove('hidden');$('#tabs').classList.remove('hidden');$('#content').classList.remove('hidden');renderAlerts();summaryCards();renderMain() }
    function cachedText(){return data.cachedAt?`已加载服务器缓存，更新时间：${new Date(data.cachedAt).toLocaleString('zh-CN')}。`:'已加载服务器缓存。'}
    async function load(){const token=$('#token').value.trim();if(!token){alert('请粘贴当前 x-token 以更新最新数据');return}const button=$('#load');try{button.disabled=true;button.textContent='加载中...';$('#status').textContent='正在获取并保存全量报表...';data=await post('/api/load',{token,userId:$('#userId').value.trim()||'20'});$('#token').value='';showData();$('#status').textContent=`数据已更新并保存。${cachedText()} Token 未保存。`}catch(error){$('#status').textContent=error.message;alert(error.message)}finally{button.disabled=false;button.textContent='更新全量数据'}}
    $('#load').onclick=load;
    $('#alerts').onclick=event=>{const dismissId=event.target.dataset.dismissAlert;if(dismissId){const ids=dismissedAlertIds();ids.add(dismissId);saveDismissedAlertIds(ids);renderAlerts();return}if(event.target.dataset.restoreAlerts!==undefined){const ids=dismissedAlertIds();for(const item of data.alerts?.items||[])ids.delete(alertId(data.alerts,item));saveDismissedAlertIds(ids);renderAlerts()}};
    get('/api/current').then(result=>{data=result;showData();$('#status').textContent=cachedText()}).catch(()=>{$('#status').textContent='暂无服务器缓存数据，请粘贴 x-token 后加载一次。'});
    $('#apply').onclick=async()=>{try{$('#loading').textContent='计算中...';data=await post('/api/analyze',{start:$('#start').value,end:$('#end').value});page=1;drillPage=1;renderAlerts();summaryCards();renderMain()}catch(error){alert(error.message)}finally{$('#loading').textContent=''}};
    $('#tabs').onclick=event=>{if(!event.target.dataset.key)return;active=event.target.dataset.key;page=1;drillPage=1;document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab===event.target));renderMain()};
    $('#pager').onclick=event=>{if(!event.target.dataset.step)return;page+=Number(event.target.dataset.step);renderMain()};
    $('#drillSelect').onchange=()=>{drillPage=1;renderDetail()};
    $('#taskSelect').onchange=()=>{drillPage=1;renderDetail()};
    $('#drillPager').onclick=event=>{if(!event.target.dataset.step)return;drillPage+=Number(event.target.dataset.step);renderDetail()};
    window.addEventListener('resize',()=>{mainChart?.resize();detailChart?.resize()});
  </script>
</body>
</html>
